<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khun Mhee – เข้าสู่ระบบแอดมิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;family=Noto+Sans+Thai:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDE6D7;color:#47413A;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Noto Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#47413A;text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
button:active{transform:scale(0.95)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #A1805D;outline-offset:2px}
input{font-family:inherit}
</style>
</head>
<body>
<div id="app"></div>
<template id="view">
<div style="width: 100%; min-width: 0; min-height: 900px; background: #EDE6D7; display: flex; flex-direction: column">

<header style="background: #3A352F; color: #F6F3EE; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-sizing: border-box; font-size: 12px">
<a href="index.html" style="color: #F6F3EE; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F6F3EE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="10" r="2"></circle><circle cx="9.5" cy="5.5" r="2"></circle><circle cx="14.5" cy="5.5" r="2"></circle><circle cx="18.5" cy="10" r="2"></circle><path d="M12 12c-3 0-5.5 3.5-5.5 6 0 1.6 1.3 2.5 2.8 2.5 1.1 0 1.8-.6 2.7-.6s1.6.6 2.7.6c1.5 0 2.8-.9 2.8-2.5 0-2.5-2.5-6-5.5-6z"></path></svg>
Khun Mhee · หลังบ้าน</a>
<a href="index.html" style="color: #EDE6D7; font-size: 12px">กลับหน้าเว็บไซต์</a>
</header>

<main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 64px 16px; box-sizing: border-box">
<div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span style="width: 64px; height: 64px; border-radius: 18px; background: #F6F3EE; display: flex; align-items: center; justify-content: center" aria-hidden="true">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#A1805D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="10" r="2"></circle><circle cx="9.5" cy="5.5" r="2"></circle><circle cx="14.5" cy="5.5" r="2"></circle><circle cx="18.5" cy="10" r="2"></circle><path d="M12 12c-3 0-5.5 3.5-5.5 6 0 1.6 1.3 2.5 2.8 2.5 1.1 0 1.8-.6 2.7-.6s1.6.6 2.7.6c1.5 0 2.8-.9 2.8-2.5 0-2.5-2.5-6-5.5-6z"></path></svg>
</span>
<h1 style="margin: 0; font-size: 32px; font-weight: 600; line-height: 1.25">เข้าสู่ระบบหลังบ้าน</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5E554C">สำหรับผู้ดูแล Khun Mhee เท่านั้น</p>
</div>

<form onSubmit="{{submit}}" style="background: #F6F3EE; border-radius: 18px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #47413A">
ชื่อผู้ใช้
<input type="text" autocomplete="username" value="{{user}}" onInput="{{setUser}}" placeholder="admin" style="height: 48px; border: 1px solid #7A6E63; border-radius: 11px; padding: 0 14px; font-size: 16px; font-weight: 400; color: #47413A; background: #FFFDF9; box-sizing: border-box; width: 100%">
</label>

<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #47413A">
รหัสผ่าน
<span style="position: relative; display: flex">
<input type="{{pwType}}" autocomplete="current-password" value="{{pw}}" onInput="{{setPw}}" placeholder="อย่างน้อย 8 ตัวอักษร" style="height: 48px; border: 1px solid #7A6E63; border-radius: 11px; padding: 0 56px 0 14px; font-size: 16px; font-weight: 400; color: #47413A; background: #FFFDF9; box-sizing: border-box; width: 100%">
<button type="button" onClick="{{togglePw}}" aria-label="{{pwToggleLabel}}" aria-pressed="{{showPw}}" style="position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #5E554C">
<template data-sc="if" value="{{showPw}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a15.6 15.6 0 0 1-2.6 3.2M6.6 6.6C4.3 8.1 3 12 3 12s4 6 9 6a8.6 8.6 0 0 0 4.4-1.2"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></template>
<template data-sc="if" value="{{hidePw}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12s4-6 9-6 9 6 9 6-4 6-9 6-9-6-9-6z"></path><circle cx="12" cy="12" r="3"></circle></svg></template>
</button>
</span>
</label>

<template data-sc="if" value="{{hasError}}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.5; color: #9A4E60; background: #FFFDF9; border: 1px solid #C88193; border-radius: 11px; padding: 10px 12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: 0 0 18px; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>
<span>{{error}}</span>
</p>
</template>

<button type="submit" disabled="{{busy}}" style="height: 48px; border: 0; border-radius: 11px; background: {{accent}}; color: #F6F3EE; font-size: 16px; font-weight: 600">{{btnLabel}}</button>

<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5E554C; text-align: center">ใส่รหัสผิด 5 ครั้ง บัญชีจะถูกล็อก 15 นาที<br>ลืมรหัสผ่าน ติดต่อแอดมินอีกคนเพื่อรีเซ็ต</p>
</form>

<p style="margin: 0; font-size: 12px; color: #7A6E63; text-align: center">การเข้าสู่ระบบจะหมดอายุภายใน 6 ชั่วโมง</p>
</div>
</main>
</div>
</template>
<script src="js/morphdom.min.js"></script>
<script src="js/runtime.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { user: '', pw: '', showPw: false, error: '', busy: false };
}
componentDidMount() {
const t = kmToken.get();
if (t) kmApi('getCurrentUser', t).then((u) => { if (u) location.replace('admin.html'); }).catch(() => {});
}
renderVals() {
const s = this.state;
return {
accent: this.props.accent ?? '#47413A',
user: s.user,
pw: s.pw,
showPw: s.showPw,
hidePw: !s.showPw,
pwType: s.showPw ? 'text' : 'password',
pwToggleLabel: s.showPw ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน',
error: s.error,
hasError: !!s.error,
busy: s.busy,
btnLabel: s.busy ? 'กำลังเข้าสู่ระบบ…' : 'เข้าสู่ระบบ',
setUser: (e) => this.setState({ user: e.target.value, error: '' }),
setPw: (e) => this.setState({ pw: e.target.value, error: '' }),
togglePw: () => this.setState({ showPw: !s.showPw }),
submit: (e) => {
if (e && e.preventDefault) e.preventDefault();
if (s.busy) return;
if (!s.user.trim() || !s.pw) return this.setState({ error: 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน' });
this.setState({ busy: true, error: '' });
kmApi('login', s.user.trim(), s.pw)
.then((r) => { kmToken.set(r.token); kmToken.setUser(r.user); location.replace('admin.html'); })
.catch((err) => this.setState({ busy: false, pw: '', error: err.message }));
}
};
}
}
DC.mount(Component, {"accent": "#47413A"});
</script>
</body>
</html>
