<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khun Mhee – Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;family=Noto+Sans+Thai:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDE6D7;color:#47413A;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Noto Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#47413A;text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
button:active{transform:scale(0.95)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #A1805D;outline-offset:2px}
input{font-family:inherit}
table{border-collapse:collapse;width:100%}
th{font-weight:600;text-align:left}
@media (max-width:833px){
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
 .side{flex-direction:row !important;flex-wrap:wrap !important}
 .side-extra{display:none !important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="view">
<div style="width: 100%; min-width: 0; background: #EDE6D7; min-height: 100vh">

<header style="background: #3A352F; color: #F6F3EE; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-sizing: border-box; font-size: 12px">
<a href="index.html" style="color: #F6F3EE; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F6F3EE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="10" r="2"></circle><circle cx="9.5" cy="5.5" r="2"></circle><circle cx="14.5" cy="5.5" r="2"></circle><circle cx="18.5" cy="10" r="2"></circle><path d="M12 12c-3 0-5.5 3.5-5.5 6 0 1.6 1.3 2.5 2.8 2.5 1.1 0 1.8-.6 2.7-.6s1.6.6 2.7.6c1.5 0 2.8-.9 2.8-2.5 0-2.5-2.5-6-5.5-6z"></path></svg>
Khun Mhee · หลังบ้าน</a>
<div style="display: flex; align-items: center; gap: 16px">
<button type="button" onClick="{{markAll}}" aria-label="การแจ้งเตือน {{unread}} รายการที่ยังไม่อ่าน" style="position: relative; background: transparent; border: 0; color: #F6F3EE; padding: 8px; display: flex">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F6F3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
<template data-sc="if" value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: 2px; right: 0; min-width: 16px; height: 16px; border-radius: 9999px; background: #C88193; color: #3A352F; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box">{{unread}}</span></template>
</button>
<template data-sc="if" value="{{sheetUrl}}" hint-placeholder-val="{{ true }}"><a href="{{sheetUrl}}" target="_blank" rel="noopener" style="color: #F6F3EE; border: 1px solid #6B6258; border-radius: 8px; padding: 6px 10px; font-size: 12px">Google Sheets ↗</a></template>
<span style="color: #EDE6D7">แอดมิน: {{meName}}</span>
<button type="button" onClick="{{logout}}" style="background: transparent; border: 1px solid #6B6258; color: #F6F3EE; border-radius: 8px; padding: 6px 10px; font-size: 12px">ออกจากระบบ</button>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1440px; margin: 0 auto">

<!-- Side menu -->
<nav aria-label="เมนูหลังบ้าน" class="side" style="flex: 1 1 200px; max-width: 240px; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px">
<a href="#overview" style="padding: 10px 14px; border-radius: 8px; background: #F6F3EE; color: #47413A; font-weight: 600">ภาพรวม</a>
<a href="#bookings" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">การจองทั้งหมด</a>
<a href="#calendar" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">ปฏิทินห้องพัก</a>
<a href="#notify" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">การแจ้งเตือน</a>
<a href="#reminders" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">เตือนก่อนเช็คอิน</a>
<a href="#bookings" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">ข้อมูลลูกค้า</a>
<a href="#stats" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">สถิติ</a>
<a href="#pricing" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">ราคาห้อง</a>
<template data-sc="if" value="{{sheetUrl}}" hint-placeholder-val="{{ true }}"><a href="{{sheetUrl}}" target="_blank" rel="noopener" style="padding: 10px 14px; border-radius: 8px; color: #2F6B45; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M4 9h16M4 15h16M10 3v18"></path></svg>เปิด Google Sheets<span aria-hidden="true">↗</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">(เปิดในแท็บใหม่)</span></a></template>
<a class="side-extra" href="index.html" style="padding: 10px 14px; border-radius: 8px; color: {{accent}}; margin-top: 16px">ดูหน้าเว็บไซต์ ›</a>
</nav>

<!-- Content -->
<main id="overview" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div>
<p style="margin: 0; font-size: 14px; color: #7A6E63">{{todayLong}}</p>
<h1 style="margin: 4px 0 0; font-size: 40px; font-weight: 600; line-height: 1.2">{{greeting}}</h1>
</div>
<div style="display: flex; align-items: center; gap: 12px"><span style="font-size: 12px; color: #7A6E63">{{updatedLabel}}</span><button type="button" onClick="{{refresh}}" disabled="{{loading}}" style="background: #F6F3EE; color: #47413A; border: 1px solid #DED4C1; border-radius: 9999px; padding: 8px 16px; font-size: 14px">{{refreshLabel}}</button></div>
</div>
<template data-sc="if" value="{{loadErr}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; background: #FFFDF9; border: 1px solid #C88193; border-radius: 11px; padding: 12px 14px; font-size: 14px; color: #9A4E60">{{loadErr}}</p></template>
<template data-sc="if" value="{{toast}}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; background: #3A352F; color: #F6F3EE; border-radius: 11px; padding: 12px 14px; font-size: 14px">{{toast}}</p></template>

<!-- KPIs -->
<div class="kpis" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<template data-sc="for" list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="background: #F6F3EE; border-radius: 18px; padding: 20px 24px">
<p style="margin: 0; font-size: 14px; color: #5E554C">{{k.label}}</p>
<p style="margin: 8px 0 0; font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -0.28px">{{k.value}}<span style="font-size: 17px; font-weight: 400; color: #7A6E63">{{k.unit}}</span></p>
<p style="margin: 8px 0 0; font-size: 12px; color: #7A6E63">{{k.sub}}</p>
</div>
</template>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<!-- Notifications -->
<section id="notify" aria-labelledby="h-notify" style="flex: 3 1 420px; min-width: 0; background: #F6F3EE; border-radius: 18px; padding: 24px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<h2 id="h-notify" style="margin: 0; font-size: 21px; font-weight: 600">การแจ้งเตือน</h2>
<button type="button" onClick="{{markAll}}" style="background: transparent; border: 0; color: {{accent}}; font-size: 14px; padding: 6px 0">อ่านทั้งหมด</button>
</div>
<div role="group" aria-label="กรองการแจ้งเตือน" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px">
<template data-sc="for" list="{{nFilters}}" as="nf" hint-placeholder-count="4">
<button type="button" onClick="{{nf.pick}}" aria-pressed="{{nf.on}}" style="{{nf.style}}">{{nf.label}}</button>
</template>
</div>
<ul style="list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column">
<template data-sc="for" list="{{notes}}" as="n" hint-placeholder-count="5">
<li style="display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid #E6DDCB; align-items: flex-start">
<span style="{{n.iconStyle}}" aria-hidden="true">
<template data-sc="if" value="{{n.isNew}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></template>
<template data-sc="if" value="{{n.isPending}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></template>
<template data-sc="if" value="{{n.isCheckin}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"></circle><path d="M10.7 12.3L21 2"></path><path d="M16 7l3 3"></path></svg></template>
<template data-sc="if" value="{{n.isCancel}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></template>
<template data-sc="if" value="{{n.isRemind}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></template>
</span>
<div style="flex: 1 1 auto; min-width: 0">
<p style="margin: 0; font-size: 12px; font-weight: 600; color: #5E554C; letter-spacing: 0.2px">{{n.kind}} · <span style="font-weight: 400; color: #7A6E63">{{n.time}}</span></p>
<p style="margin: 3px 0 0; font-size: 15px; line-height: 1.5; color: #47413A">{{n.text}}</p>
</div>
<template data-sc="if" value="{{n.unread}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{n.read}}" aria-label="ทำเครื่องหมายว่าอ่านแล้ว" style="background: transparent; border: 0; padding: 8px; display: flex"><span style="width: 10px; height: 10px; border-radius: 9999px; background: #C88193"></span></button>
</template>
</li>
</template>
</ul>
</section>

<!-- Check-in reminders -->
<section id="reminders" aria-labelledby="h-rem" style="flex: 2 1 320px; min-width: 0; background: #F6F3EE; border-radius: 18px; padding: 24px; box-sizing: border-box">
<h2 id="h-rem" style="margin: 0; font-size: 21px; font-weight: 600">เตือนกันลืม · ใกล้เช็คอิน</h2>
<p style="margin: 6px 0 0; font-size: 14px; color: #7A6E63">ลูกค้าที่จะเช็คอินภายใน 1-3 วัน</p>
<p style="margin: 4px 0 0; font-size: 12px; color: #7A6E63">{{autoNote}}</p>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: #EDE6D7; border-radius: 11px; padding: 12px 14px; margin-top: 16px; font-size: 14px">
<span style="display: flex; align-items: center; gap: 8px; flex: 1 1 200px"><span style="{{lineDot}}" aria-hidden="true"></span><span>แจ้งเตือน LINE: {{lineStatus}}</span></span>
<button type="button" onClick="{{testLine}}" disabled="{{lineBtnDisabled}}" style="{{lineBtnStyle}}">ทดสอบส่ง LINE</button>
</div>
<template data-sc="if" value="{{autoOff}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: #FFFDF9; border: 1px solid #C88193; border-radius: 11px; padding: 12px 14px; margin-top: 8px; font-size: 14px; color: #9A4E60"><span style="flex: 1 1 200px">ยังไม่ได้เปิดการแจ้งเตือนเช็คอินอัตโนมัติรายวัน</span><button type="button" onClick="{{enableAuto}}" style="flex: 0 0 auto; border-radius: 9999px; padding: 8px 14px; font-size: 13px; border: 0; background: #47413A; color: #F6F3EE">เปิดใช้งาน</button></div></template>
<ul style="list-style: none; margin: 12px 0 0; padding: 0">
<template data-sc="for" list="{{reminders}}" as="r" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #E6DDCB">
<div style="width: 56px; flex: 0 0 56px; text-align: center; background: #3E6A9E; color: #F6F3EE; border-radius: 11px; padding: 6px 0">
<p style="margin: 0; font-size: 11px; color: #E3ECF6">{{r.when}}</p>
<p style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2">{{r.day}}</p>
</div>
<div style="flex: 1 1 auto; min-width: 0">
<p style="margin: 0; font-size: 15px; font-weight: 600">{{r.name}}</p>
<p style="margin: 2px 0 0; font-size: 12px; color: #7A6E63">{{r.room}} · {{r.phone}} · {{r.pets}}</p>
<p style="margin: 2px 0 0; font-size: 12px; color: #7A6E63">{{r.emailNote}}</p>
</div>
<button type="button" onClick="{{r.send}}" disabled="{{r.sent}}" style="{{r.btnStyle}}">{{r.btn}}</button>
</li>
</template>
</ul>
</section>

</div>

<!-- Occupancy calendar -->
<section id="calendar" aria-labelledby="h-cal" style="background: #F6F3EE; border-radius: 18px; padding: 24px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
<h2 id="h-cal" style="margin: 0; font-size: 21px; font-weight: 600">ปฏิทินห้องพักรายเดือน</h2>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{prevMonth}}" disabled="{{noPrev}}" aria-label="เดือนก่อนหน้า" style="{{prevStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<span style="font-size: 17px; font-weight: 600; min-width: 150px; text-align: center">{{monthTitle}}</span>
<button type="button" onClick="{{nextMonth}}" disabled="{{noNext}}" aria-label="เดือนถัดไป" style="{{nextStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
</div>
<div style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: #47413A">
<template data-sc="for" list="{{legend}}" as="lg" hint-placeholder-count="5"><span style="display: flex; align-items: center; gap: 6px"><span style="{{lg.dot}}"></span>{{lg.name}}</span></template>
</div>
<div style="overflow-x: auto; margin-top: 16px">
<div style="min-width: 760px">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; font-size: 13px; font-weight: 600; color: #7A6E63; padding: 0 0 8px">
<span style="padding-left: 8px">อาทิตย์</span><span style="padding-left: 8px">จันทร์</span><span style="padding-left: 8px">อังคาร</span><span style="padding-left: 8px">พุธ</span><span style="padding-left: 8px">พฤหัสบดี</span><span style="padding-left: 8px">ศุกร์</span><span style="padding-left: 8px">เสาร์</span>
</div>
<template data-sc="for" list="{{weeks}}" as="w" hint-placeholder-count="5">
<div style="position: relative; border-top: 1px solid #E6DDCB; padding: 10px 0 14px; min-height: 96px; box-sizing: border-box">
<div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; pointer-events: none">
<template data-sc="for" list="{{w.days}}" as="d" hint-placeholder-count="7"><span style="{{d.bg}}"></span></template>
</div>
<div style="position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
<template data-sc="for" list="{{w.days}}" as="d" hint-placeholder-count="7"><span style="{{d.style}}">{{d.n}}</span></template>
</div>
<div style="position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: 8px; row-gap: 6px; margin-top: 8px; grid-auto-flow: row dense">
<template data-sc="for" list="{{w.bars}}" as="b" hint-placeholder-count="2"><span title="{{b.title}}" style="{{b.style}}">{{b.label}}</span></template>
</div>
</div>
</template>
</div>
</div>
</section>

<!-- Bookings table -->
<section id="bookings" aria-labelledby="h-book" style="background: #F6F3EE; border-radius: 18px; padding: 24px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<h2 id="h-book" style="margin: 0; font-size: 21px; font-weight: 600">ข้อมูลการจองและผู้เข้าพัก</h2>
<label style="display: flex; align-items: center; gap: 8px; border: 1px solid rgba(0,0,0,0.08); border-radius: 9999px; padding: 0 16px; height: 40px; min-width: 240px; box-sizing: border-box">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7A6E63" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">ค้นหาชื่อหรือเบอร์โทร</span>
<input type="search" value="{{q}}" onInput="{{setQ}}" placeholder="ค้นหาชื่อ หรือเบอร์โทร" style="border: 0; outline-offset: 4px; font-size: 14px; flex: 1 1 auto; min-width: 0; background: transparent; color: #47413A">
</label>
</div>
<div role="group" aria-label="กรองสถานะ" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px">
<template data-sc="for" list="{{bFilters}}" as="bf" hint-placeholder-count="4">
<button type="button" onClick="{{bf.pick}}" aria-pressed="{{bf.on}}" style="{{bf.style}}">{{bf.label}}</button>
</template>
</div>
<div style="overflow-x: auto; margin-top: 16px">
<table style="min-width: 1180px; font-size: 14px">
<thead>
<tr style="color: #7A6E63; font-size: 12px">
<th style="padding: 10px 12px 10px 0; font-weight: 600">เลขที่จอง</th>
<th style="padding: 10px 12px; font-weight: 600">ชื่อ-นามสกุล</th>
<th style="padding: 10px 12px; font-weight: 600">เบอร์โทรศัพท์</th>
<th style="padding: 10px 12px; font-weight: 600">ห้อง</th>
<th style="padding: 10px 12px; font-weight: 600">เช็คอิน</th>
<th style="padding: 10px 12px; font-weight: 600">เช็คเอาท์</th>
<th style="padding: 10px 12px; font-weight: 600">สัตว์เลี้ยง</th>
<th style="padding: 10px 12px; font-weight: 600">ยอดรวม</th>
<th style="padding: 10px 12px; font-weight: 600">สลิป / ใบเสร็จ</th>
<th style="padding: 10px 12px; font-weight: 600">สถานะ</th>
<th style="padding: 10px 0 10px 12px; font-weight: 600">จัดการ</th>
</tr>
</thead>
<tbody>
<template data-sc="for" list="{{rows}}" as="b" hint-placeholder-count="6">
<tr style="border-top: 1px solid #E6DDCB">
<td style="padding: 14px 12px 14px 0; color: #7A6E63; font-variant-numeric: tabular-nums">{{b.code}}</td>
<td style="padding: 14px 12px; font-weight: 600">{{b.name}}</td>
<td style="padding: 14px 12px; font-variant-numeric: tabular-nums">{{b.phone}}</td>
<td style="padding: 14px 12px">{{b.room}}</td>
<td style="padding: 14px 12px">{{b.ci}}</td>
<td style="padding: 14px 12px">{{b.co}}</td>
<td style="padding: 14px 12px">{{b.pets}}</td>
<td style="padding: 14px 12px; font-variant-numeric: tabular-nums">{{b.total}}</td>

stChartBox = 'display: flex; align-items: flex-end; gap: 4px; height: 210px; min-width: ' + (stBars.length * (minW + 4)) + 'px; padding-top: 8px; box-sizing: border-box; border-bottom: 1px solid #DED4C1;';
stChartTitle = daily ? 'รายได้รายวัน' : 'รายได้รายเดือน';
stChartAria = stChartTitle + ' ' + st.series.filter((x) => x.revenue).map((x) => x.key + ' ' + x.revenue + ' บาท').join(', ');
stRooms = st.byRoom.map((r) => ({ name: r.name || ('ห้อง ' + r.roomNo), bookings: String(r.bookings), nights: String(r.nights),
occ: pct(r.occupancy), occBar: 'display: block; height: 100%; width: ' + Math.min(100, Math.round(r.occupancy * 100)) + '%; background: #3E6A9E;',
revenue: baht(r.revenue), cancelled: r.cancelled ? String(r.cancelled) : '–' }));
const maxW = Math.max(1, ...st.byWeekday.map((w) => w.bookings));
stWeek = [1, 2, 3, 4, 5, 6, 0].map((d) => { const w = st.byWeekday[d]; return { day: WD[d], n: w.bookings + ' ครั้ง',
bar: 'display: block; height: 100%; width: ' + Math.round(w.bookings / maxW * 100) + '%; background: #A1805D;' }; });
const dot = (c) => 'width: 10px; height: 10px; border-radius: 9999px; display: inline-block; background: ' + c + ';';
const SRC = { web: 'จองผ่านเว็บไซต์', admin: 'แอดมินบันทึกเอง', other: 'อื่น ๆ' };
stLists = [
{ title: 'สถานะการจอง', rows: ['pending', 'confirmed', 'checked_in', 'checked_out', 'cancelled'].map((k) => ({ label: ST[k].name, n: String(st.statusCounts[k] || 0), dot: dot(ST[k].bg) })) },
{ title: 'ช่องทางการจอง', rows: Object.keys(st.bySource).map((k) => ({ label: SRC[k] || k, n: String(st.bySource[k]), dot: dot('#7A6E63') })) },
{ title: 'วิธีชำระเงิน', rows: Object.keys(st.byPayMethod).map((k) => ({ label: (st.payMethods && st.payMethods[k]) || (k === 'other' ? 'ไม่ระบุ' : k), n: String(st.byPayMethod[k]), dot: dot('#3E6A9E') })) }
].map((g) => g.rows.length ? g : Object.assign(g, { rows: [{ label: 'ยังไม่มีข้อมูล', n: '–', dot: dot('#DED4C1') }] }));
}
const stRangeLabel = st ? (s.stRange === 'all' ? 'ทั้งหมดตั้งแต่การจองแรก ' : '') + fullDate(st.from) + ' – ' + fullDate(st.to) + ' (นับตามวันเช็คอิน)' : 'เลือกช่วงเวลาที่ต้องการดู';

// ===== ราคาห้อง =====
const pr = s.pr;
const fieldStyle = 'height: 44px; border: 1px solid #CFC3AC; border-radius: 11px; padding: 0 12px; font-size: 15px; color: #47413A; background: #FFFDF9; box-sizing: border-box;';

if (r.leadType === 'advance') parts.push('จองล่วงหน้าอย่างน้อย ' + r.leadDays + ' วัน');

};
const blankRule = { id: '', name: '', rooms: [], days: [], startDate: '', endDate: '', leadType: '', leadDays: '', adjustType: 'percent', amount: '', priority: '0', status: 'active' };
const openRule = (r) => {
this.setState({ rfErr: '', rf: r ? { id: r.id, name: r.name, rooms: r.rooms.slice(), days: r.days.slice(), startDate: r.startDate, endDate: r.endDate,
leadType: r.leadType, leadDays: r.leadType ? String(r.leadDays) : '', adjustType: r.adjustType, amount: String(r.amount), priority: String(r.priority), status: r.status } : Object.assign({}, blankRule) },
() => { const f = document.getElementById('rule-form'); if (f) { f.scrollIntoView({ behavior: 'smooth', block: 'center' }); const i = f.querySelector('input'); if (i) i.focus({ preventScroll: true }); } });
};
const prRules = (pr ? pr.rules : []).map((r) => {
const on = r.status === 'active';
const busy = s.acting === 'rule' + r.id;
const up = r.adjustType === 'set' || r.amount >= 0;
return { name: r.name, when: whenText(r), priority: String(r.priority), adj: adjText(r),
adjStyle: 'flex: 0 0 auto; min-width: 86px; text-align: center; border-radius: 11px; padding: 10px 8px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; ' + (on ? (up ? 'background: #EFE2B4; color: #6B4E1E;' : 'background: #DCE8DD; color: #2F5A33;') : 'background: #EDE6D7; color: #7A6E63;'),
statusName: on ? 'ใช้งานอยู่' : 'ปิดอยู่',
badge: 'display: inline-block; margin-left: 6px; border-radius: 9999px; padding: 2px 8px; font-size: 11px; font-weight: 600; vertical-align: middle; ' + (on ? 'background: #4F7A52; color: #F6F3EE;' : 'background: #DED4C1; color: #47413A;'),
busy, toggleLabel: on ? 'ปิดชั่วคราว' : 'เปิดใช้',

del: () => { if (window.confirm('ลบกฎ "' + r.name + '" ?')) this.actPrice(kmApi('deletePriceRule', t, r.id), 'rule' + r.id).catch(() => {}); } };
});
const rf = s.rf || blankRule;
const setRf = (patch) => this.setState({ rf: Object.assign({}, this.state.rf, patch), rfErr: '' });
const toggleIn = (arr, v) => arr.indexOf(v) >= 0 ? arr.filter((x) => x !== v) : arr.concat([v]);
const rfRooms = [{ label: 'ทุกห้อง', on: !rf.rooms.length, style: chip(!rf.rooms.length), pick: () => setRf({ rooms: [] }) }]

const rfDays = [1, 2, 3, 4, 5, 6, 0].map((d) => ({ label: WD[d], on: rf.days.indexOf(d) >= 0, style: chip(rf.days.indexOf(d) >= 0), pick: () => setRf({ days: toggleIn(this.state.rf.days, d) }) }));
const amt = Number(rf.amount);
const sample = roomsList[0] ? roomsList[0].pricePerNight : 1500;
const after = isFinite(amt) && rf.amount !== '' ? Math.max(0, Math.round(rf.adjustType === 'set' ? amt : rf.adjustType === 'fixed' ? sample + amt : sample * (1 + amt / 100))) : null;
const rfExample = after === null ? (rf.adjustType === 'percent' ? 'ใส่ 20 = แพงขึ้น 20% · ใส่ -10 = ลด 10%' : rf.adjustType === 'fixed' ? 'ใส่ 300 = เพิ่มคืนละ 300 บาท · ใส่ -200 = ลดคืนละ 200 บาท' : 'ใส่ราคาต่อคืนที่ต้องการ เช่น 3000')
: 'ตัวอย่าง: ห้องราคา ฿' + kmMoney(sample) + ' จะเป็น ฿' + kmMoney(after) + ' ในคืนที่ตรงเงื่อนไข';
const rfSave = () => {
const r = this.state.rf;
if (!r.name.trim()) { this.setState({ rfErr: 'กรุณาตั้งชื่อกฎ' }); return; }
if (r.amount === '' || !isFinite(Number(r.amount))) { this.setState({ rfErr: 'กรุณาใส่ตัวเลขที่จะปรับราคา' }); return; }
this.actPrice(kmApi('savePriceRule', t, Object.assign({}, r, { amount: Number(r.amount), priority: Number(r.priority) || 0, leadDays: Number(r.leadDays) || 0 })), 'rf')
.then(() => this.setState({ rf: null }), (e) => this.setState({ rfErr: e.message }));
};

// ตัวอย่างราคา 14 คืน
const pv = s.pv;
const pvDates = pv ? pv.dates.map((d) => { const wd = kmDate.weekday(d); return { wd: WDS[wd], dm: kmDate.dm(d),
style: 'padding: 8px 6px; text-align: right; white-space: nowrap; font-weight: 600; ' + (wd === 0 || wd === 6 ? 'color: #8B5E3C;' : '') + (d === today ? ' text-decoration: underline;' : '') }; }) : [];
const pvRows = pv ? pv.rooms.map((r) => ({ name: r.name || ('ห้อง ' + r.roomNo), cells: r.nights.map((n) => ({ v: kmMoney(n.price),
title: fullDate(n.date) + ' · ฿' + kmMoney(n.price) + (n.rules.length ? ' · กฎ: ' + n.rules.join(', ') : ' · ราคาพื้นฐาน'),
style: 'padding: 8px 6px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; ' + (n.price !== n.base ? 'background: #EFE2B4; font-weight: 600; ' + (n.price < n.base ? 'color: #2F5A33;' : 'color: #6B4E1E;') : 'color: #47413A;') })) })) : [];
const pvNav = 'width: 36px; height: 36px; border-radius: 9999px; border: 1px solid #DED4C1; background: #F6F3EE; color: #47413A; display: flex; align-items: center; justify-content: center; padding: 0;';
const h = new Date().getHours();
const me = s.me || {};
return {
accent: this.props.accent ?? '#47413A',
meName: me.fullname || me.username || '', greeting: (h < 12 ? 'สวัสดีตอนเช้า' : h < 17 ? 'สวัสดีตอนบ่าย' : 'สวัสดีตอนเย็น') + (me.fullname ? ' คุณ' + me.fullname : ''),
todayLong: dash ? kmDate.long(today) : 'กำลังโหลดข้อมูล…',
updatedLabel: s.updated ? 'อัปเดตล่าสุด ' + s.updated + ' น.' : '', loading: s.loading, refreshLabel: s.loading ? 'กำลังโหลด…' : 'รีเฟรชข้อมูล',
refresh: () => this.load(), loadErr: s.loadErr, toast: s.toast,
logout: () => { kmApi('logout', t).catch(() => {}); kmToken.set(null); kmToken.setUser(null); location.replace('login.html'); },
kpis, notes, nFilters, bFilters, rows, reminders, weeks, legend,
monthTitle: kmDate.monthTitle(Y, Mo), noPrev: s.monthOffset <= -6, noNext: s.monthOffset >= 12,
prevStyle: navBtn(s.monthOffset <= -6), nextStyle: navBtn(s.monthOffset >= 12),
prevMonth: () => this.setState({ monthOffset: Math.max(-6, s.monthOffset - 1) }),
nextMonth: () => this.setState({ monthOffset: Math.min(12, s.monthOffset + 1) }),
noRows: rows.length === 0, unread: String(unread), hasUnread: unread > 0,
markAll: () => this.markSeen(),
q: s.q, setQ: (e) => this.setState({ q: e.target.value }),
remHour: String((dash && dash.reminder && dash.reminder.hour) || 9),
autoOff: !!dash && !autoOn, enableAuto: () => { if (!s.acting) this.act(kmApi('setupReminders', t), 'auto'); },
autoNote: autoOn ? 'LINE แจ้งแอดมินอัตโนมัติทุกวัน ' + ((dash && dash.reminder && dash.reminder.hour) || 9) + ':00 น. · ลูกค้าที่เช็คอินวันเดียวกันรวมในแชทเดียว' : '',
sheetUrl: (dash && dash.sheetUrl) || '',
lineStatus: !lineInfo ? 'กำลังโหลด…' : !lineInfo.configured ? 'ยังไม่ได้ใส่ Channel access token' : !lineInfo.targets ? 'ยังไม่มีแอดมินลงทะเบียน (พิมพ์ "แอดมิน รหัส" ในแชท OA)' : 'เชื่อมแล้ว ' + lineInfo.targets + ' ปลายทาง',
lineDot: 'width: 10px; height: 10px; border-radius: 9999px; flex: 0 0 10px; background: ' + (lineOk ? '#06C755' : '#C88193') + ';',
lineBtnDisabled: !lineOk || s.acting === 'line',
lineBtnStyle: 'flex: 0 0 auto; border-radius: 9999px; padding: 8px 14px; font-size: 13px; border: ' + (lineOk ? '0' : '1px solid #DED4C1') + '; background: ' + (lineOk ? '#06C755' : '#F6F3EE') + '; color: ' + (lineOk ? '#FFFFFF' : '#7A6E63') + ';',
testLine: () => this.act(kmApi('sendTestLine', t), 'line'),
// สถิติ
stChips, stKpis, stFacts, stBars, stRooms, stWeek, stLists, stChartAria, stChartBox, stChartTitle, stRangeLabel,
stHas: !!st && !s.stLoading, stLoading: s.stLoading, stErr: s.stErr, stFrom: s.stFrom, stTo: s.stTo,
setStFrom: (e) => this.setState({ stFrom: e.target.value }), setStTo: (e) => this.setState({ stTo: e.target.value }),
stApply: () => { if (s.stFrom && s.stTo) this.loadStats(null, s.stFrom, s.stTo); },
fieldStyle, selectStyle, darkBtn, ghostBtn, dangerBtn,
// ราคา
prLoading: s.prLoading, prErr: s.prErr, prRooms, prRules, prNoRules: !!pr && !pr.rules.length,
prStackNote: 'ถ้าหลายกฎตรงกับคืนเดียวกัน ระบบใช้กฎที่ลำดับความสำคัญสูงสุดกฎเดียว เช่น ปีใหม่ (10) ชนะ สุดสัปดาห์ (1)',
newRule: () => openRule(null),
rfOpen: !!s.rf, rf, rfTitle: rf.id ? 'แก้ไขกฎ' : 'เพิ่มกฎใหม่', rfErr: s.rfErr, rfBusy: s.acting === 'rf', rfSaveLabel: s.acting === 'rf' ? 'กำลังบันทึก…' : 'บันทึกกฎ',
rfRooms, rfDays, rfExample, rfActive: rf.status === 'active', rfSave,
rfAmountLabel: rf.adjustType === 'percent' ? 'กี่ % *' : rf.adjustType === 'fixed' ? 'กี่บาท *' : 'ราคาต่อคืน *',
rfSetName: (e) => setRf({ name: e.target.value }), rfSetStart: (e) => setRf({ startDate: e.target.value }), rfSetEnd: (e) => setRf({ endDate: e.target.value }),
rfSetLead: (e) => setRf({ leadType: e.target.value }), rfSetLeadDays: (e) => setRf({ leadDays: e.target.value }),
rfSetAdj: (e) => setRf({ adjustType: e.target.value }), rfSetAmount: (e) => setRf({ amount: e.target.value }), rfSetPriority: (e) => setRf({ priority: e.target.value }),
rfToggleActive: (e) => setRf({ status: e.target.checked ? 'active' : 'inactive' }),
rfCancel: () => this.setState({ rf: null, rfErr: '' }),
pvFrom: s.pvFrom, pvDates, pvRows, pvNav,
pvSetFrom: (e) => { if (e.target.value) this.loadPreview(e.target.value); },
pvPrev: () => this.loadPreview(kmDate.add(s.pvFrom || today, -14)),
pvNext: () => this.loadPreview(kmDate.add(s.pvFrom || today, 14))
};
}
}
