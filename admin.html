<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khun Mhee – Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;family=Noto+Sans+Thai:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDE6D7;color:#47413A;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Noto Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#47413A;text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
button:active{transform:scale(0.95)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #A1805D;outline-offset:2px}
input{font-family:inherit}
table{border-collapse:collapse;width:100%}
th{font-weight:600;text-align:left}
@media (max-width:833px){
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
 .side{flex-direction:row !important;flex-wrap:wrap !important}
 .side-extra{display:none !important}
}
/* การแจ้งเตือน / ปฏิทิน / ตารางการจอง */
.km-bell:hover{background:rgba(246,243,238,.14)}
.km-badge{animation:kmPulse 1.8s ease-out infinite}
@keyframes kmPulse{0%{box-shadow:0 0 0 0 rgba(224,36,43,.75)}70%{box-shadow:0 0 0 10px rgba(224,36,43,0)}100%{box-shadow:0 0 0 0 rgba(224,36,43,0)}}
.km-note:hover{background:rgba(71,65,58,.06)}
.km-del:hover{background:#F3D9D6;color:#B5443F !important}
.km-bar:hover{filter:brightness(1.08)}
.km-flash{animation:kmFlash .6s ease-in-out .45s 3}
@keyframes kmFlash{50%{background-color:#E0242B;box-shadow:0 0 0 3px #E0242B;color:#FFFFFF}}
.km-sticky th{white-space:nowrap;position:sticky;top:0;z-index:2;background:#F6F3EE;box-shadow:inset 0 -1px 0 #E6DDCB}
#notify button:disabled{cursor:default;opacity:.45}
@media (prefers-reduced-motion:reduce){.km-badge{animation:none}}
.km-dlg{animation:kmPop .16s ease-out}
@keyframes kmPop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.km-dlg{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="view">
<div style="width: 100%; min-width: 0; background: #EDE6D7; min-height: 100vh">

<header style="background: #3A352F; color: #F6F3EE; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-sizing: border-box; font-size: 12px">
<a href="index.html" style="color: #F6F3EE; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F6F3EE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="10" r="2"></circle><circle cx="9.5" cy="5.5" r="2"></circle><circle cx="14.5" cy="5.5" r="2"></circle><circle cx="18.5" cy="10" r="2"></circle><path d="M12 12c-3 0-5.5 3.5-5.5 6 0 1.6 1.3 2.5 2.8 2.5 1.1 0 1.8-.6 2.7-.6s1.6.6 2.7.6c1.5 0 2.8-.9 2.8-2.5 0-2.5-2.5-6-5.5-6z"></path></svg>
Khun Mhee · หลังบ้าน</a>
<div style="display: flex; align-items: center; gap: 16px">
<button type="button" onClick="{{goNotify}}" aria-label="การแจ้งเตือน {{unread}} รายการที่ยังไม่อ่าน" class="km-bell" style="position: relative; background: transparent; border: 0; color: #F6F3EE; width: 48px; height: 48px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 9999px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F6F3EE" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
<template data-sc="if" value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><span class="km-badge" style="position: absolute; top: 0; right: -4px; min-width: 26px; height: 26px; border-radius: 9999px; background: #E0242B; color: #FFFFFF; font-size: 14px; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0 7px; box-sizing: border-box; border: 2px solid #3A352F; font-variant-numeric: tabular-nums">{{unreadBadge}}</span></template>
</button>
<template data-sc="if" value="{{sheetUrl}}" hint-placeholder-val="{{ true }}"><a href="{{sheetUrl}}" target="_blank" rel="noopener" style="color: #F6F3EE; border: 1px solid #6B6258; border-radius: 8px; padding: 6px 10px; font-size: 12px">Google Sheets ↗</a></template>
<span style="color: #EDE6D7">แอดมิน: {{meName}}</span>
<button type="button" onClick="{{logout}}" style="background: transparent; border: 1px solid #6B6258; color: #F6F3EE; border-radius: 8px; padding: 6px 10px; font-size: 12px">ออกจากระบบ</button>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; box-sizing: border-box; max-width: 1440px; margin: 0 auto">

<!-- Side menu -->
<nav aria-label="เมนูหลังบ้าน" class="side" style="flex: 1 1 200px; max-width: 240px; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px">
<a href="#overview" style="padding: 10px 14px; border-radius: 8px; background: #F6F3EE; color: #47413A; font-weight: 600">ภาพรวม</a>
<a href="#bookings" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">การจองทั้งหมด</a>
<a href="#calendar" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">ปฏิทินห้องพัก</a>
<a href="#notify" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">การแจ้งเตือน</a>
<a href="#reminders" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">เตือนก่อนเช็คอิน</a>
<a href="#bookings" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">ข้อมูลลูกค้า</a>
<a href="#stats" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">สถิติ</a>
<a href="#pricing" style="padding: 10px 14px; border-radius: 8px; color: #5E554C">ราคาห้อง</a>
<template data-sc="if" value="{{sheetUrl}}" hint-placeholder-val="{{ true }}"><a href="{{sheetUrl}}" target="_blank" rel="noopener" style="padding: 10px 14px; border-radius: 8px; color: #2F6B45; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M4 9h16M4 15h16M10 3v18"></path></svg>เปิด Google Sheets<span aria-hidden="true">↗</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">(เปิดในแท็บใหม่)</span></a></template>
<template data-sc="if" value="{{slipFolderUrl}}" hint-placeholder-val="{{ true }}"><a href="{{slipFolderUrl}}" target="_blank" rel="noopener" style="padding: 10px 14px; border-radius: 8px; color: #335A88; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>โฟลเดอร์สลิป (Drive)<span aria-hidden="true">↗</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">(เปิดในแท็บใหม่)</span></a></template>
<template data-sc="if" value="{{receiptFolderUrl}}" hint-placeholder-val="{{ true }}"><a href="{{receiptFolderUrl}}" target="_blank" rel="noopener" style="padding: 10px 14px; border-radius: 8px; color: #2F6B45; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>โฟลเดอร์ใบเสร็จ (Drive)<span aria-hidden="true">↗</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">(เปิดในแท็บใหม่)</span></a></template>
<a class="side-extra" href="index.html" style="padding: 10px 14px; border-radius: 8px; color: {{accent}}; margin-top: 16px">ดูหน้าเว็บไซต์ ›</a>
</nav>

<!-- Content -->
<main id="overview" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div>
<p style="margin: 0; font-size: 14px; color: #7A6E63">{{todayLong}}</p>
<h1 style="margin: 4px 0 0; font-size: 40px; font-weight: 600; line-height: 1.2">{{greeting}}</h1>
</div>
<div style="display: flex; align-items: center; gap: 12px"><span style="font-size: 12px; color: #7A6E63">{{updatedLabel}}</span><button type="button" onClick="{{refresh}}" disabled="{{loading}}" style="background: #F6F3EE; color: #47413A; border: 1px solid #DED4C1; border-radius: 9999px; padding: 8px 16px; font-size: 14px">{{refreshLabel}}</button></div>
</div>
<template data-sc="if" value="{{loadErr}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; background: #FFFDF9; border: 1px solid #C88193; border-radius: 11px; padding: 12px 14px; font-size: 14px; color: #9A4E60">{{loadErr}}</p></template>
<template data-sc="if" value="{{toast}}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; background: #3A352F; color: #F6F3EE; border-radius: 11px; padding: 12px 14px; font-size: 14px">{{toast}}</p></template>

<!-- KPIs -->
<div class="kpis" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<template data-sc="for" list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="background: #F6F3EE; border-radius: 18px; padding: 20px 24px">
<p style="margin: 0; font-size: 14px; color: #5E554C">{{k.label}}</p>
<p style="margin: 8px 0 0; font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -0.28px">{{k.value}}<span style="font-size: 17px; font-weight: 400; color: #7A6E63">{{k.unit}}</span></p>
<p style="margin: 8px 0 0; font-size: 12px; color: #7A6E63">{{k.sub}}</p>
</div>
</template>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<!-- Notifications -->
<section id="notify" aria-labelledby="h-notify" style="flex: 3 1 420px; min-width: 0; background: #F6F3EE; border-radius: 18px; padding: 24px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<h2 id="h-notify" style="margin: 0; font-size: 21px; font-weight: 600; display: flex; align-items: center; gap: 10px">การแจ้งเตือน<template data-sc="if" value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><span style="border-radius: 9999px; background: #E0242B; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 3px 10px">ใหม่ {{unreadBadge}}</span></template></h2>
<div style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap">
<button type="button" onClick="{{markAll}}" disabled="{{noUnread}}" style="background: transparent; border: 0; color: {{accent}}; font-size: 14px; padding: 8px 10px; min-height: 40px; border-radius: 9999px">อ่านทั้งหมด</button>
<button type="button" onClick="{{clearAll}}" disabled="{{noNotes}}" style="background: transparent; border: 1px solid #B5443F; color: #B5443F; font-size: 14px; padding: 8px 14px; min-height: 40px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>{{clearLabel}}</button>
</div>
</div>
<div role="group" aria-label="กรองการแจ้งเตือน" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px">
<template data-sc="for" list="{{nFilters}}" as="nf" hint-placeholder-count="4">
<button type="button" onClick="{{nf.pick}}" aria-pressed="{{nf.on}}" style="{{nf.style}}">{{nf.label}}</button>
</template>
</div>
<template data-sc="if" value="{{noNotes}}" hint-placeholder-val="{{ false }}"><p style="margin: 20px 0 4px; text-align: center; font-size: 14px; color: #7A6E63">ไม่มีการแจ้งเตือน</p></template>
<ul id="notify-list" style="{{notifyBox}}">
<template data-sc="for" list="{{notes}}" as="n" hint-placeholder-count="5">
<li style="{{n.liStyle}}">
<button type="button" onClick="{{n.open}}" aria-label="{{n.openLabel}}" class="km-note" style="flex: 1 1 auto; min-width: 0; display: flex; gap: 14px; align-items: flex-start; text-align: left; background: transparent; border: 0; padding: 12px 6px 12px 10px; color: inherit; font: inherit; cursor: pointer; border-radius: 12px">
<span style="{{n.iconStyle}}" aria-hidden="true">
<template data-sc="if" value="{{n.isNew}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></template>
<template data-sc="if" value="{{n.isPending}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></template>
<template data-sc="if" value="{{n.isCheckin}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"></circle><path d="M10.7 12.3L21 2"></path><path d="M16 7l3 3"></path></svg></template>
<template data-sc="if" value="{{n.isCancel}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></template>
<template data-sc="if" value="{{n.isRefund}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7.5v9M14.5 9.5c0-1-1.1-1.7-2.5-1.7s-2.5.7-2.5 1.7 1.1 1.5 2.5 1.8 2.5.8 2.5 1.8-1.1 1.7-2.5 1.7-2.5-.7-2.5-1.7"></path></svg></template>
<template data-sc="if" value="{{n.isRemind}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></template>
</span>
<span style="flex: 1 1 auto; min-width: 0; display: block">
<span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; font-size: 12px; font-weight: 600; color: #5E554C; letter-spacing: 0.2px">{{n.kind}} · <span style="font-weight: 400; color: #7A6E63">{{n.time}}</span><template data-sc="if" value="{{n.unread}}" hint-placeholder-val="{{ true }}"><span style="border-radius: 9999px; background: #E0242B; color: #FFFFFF; font-size: 11px; font-weight: 700; padding: 2px 8px; letter-spacing: 0.4px">ใหม่</span></template></span>
<span style="{{n.textStyle}}">{{n.text}}</span>
</span>
</button>
<button type="button" onClick="{{n.del}}" aria-label="{{n.delLabel}}" title="ลบแจ้งเตือนนี้" class="km-del" style="flex: 0 0 40px; width: 40px; min-height: 40px; align-self: center; background: transparent; border: 0; border-radius: 9999px; color: #7A6E63; display: flex; align-items: center; justify-content: center; padding: 0; margin-right: 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</li>
</template>
</ul>
<template data-sc="if" value="{{notifyCount}}" hint-placeholder-val="{{ false }}"><p style="margin: 10px 0 0; font-size: 12px; color: #7A6E63; text-align: center">{{notifyCount}} ↓</p></template>
</section>

<!-- Check-in reminders -->
<section id="reminders" aria-labelledby="h-rem" style="flex: 2 1 320px; min-width: 0; background: #F6F3EE; border-radius: 18px; padding: 24px; box-sizing: border-box">
<h2 id="h-rem" style="margin: 0; font-size: 21px; font-weight: 600">เตือนกันลืม · ใกล้เช็คอิน</h2>
<p style="margin: 6px 0 0; font-size: 14px; color: #7A6E63">ลูกค้าที่จะเช็คอินภายใน 1-3 วัน</p>
<p style="margin: 4px 0 0; font-size: 12px; color: #7A6E63">{{autoNote}}</p>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: #EDE6D7; border-radius: 11px; padding: 12px 14px; margin-top: 16px; font-size: 14px">
<span style="display: flex; align-items: center; gap: 8px; flex: 1 1 200px"><span style="{{lineDot}}" aria-hidden="true"></span><span>แจ้งเตือน LINE: {{lineStatus}}</span></span>
<button type="button" onClick="{{testLine}}" disabled="{{lineBtnDisabled}}" style="{{lineBtnStyle}}">ทดสอบส่ง LINE</button>
</div>
<template data-sc="if" value="{{autoOff}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: #FFFDF9; border: 1px solid #C88193; border-radius: 11px; padding: 12px 14px; margin-top: 8px; font-size: 14px; color: #9A4E60"><span style="flex: 1 1 200px">ยังไม่ได้เปิดการแจ้งเตือนเช็คอินอัตโนมัติรายวัน</span><button type="button" onClick="{{enableAuto}}" style="flex: 0 0 auto; border-radius: 9999px; padding: 8px 14px; font-size: 13px; border: 0; background: #47413A; color: #F6F3EE">เปิดใช้งาน</button></div></template>
<ul style="list-style: none; margin: 12px 0 0; padding: 0">
<template data-sc="for" list="{{reminders}}" as="r" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #E6DDCB">
<div style="width: 56px; flex: 0 0 56px; text-align: center; background: #3E6A9E; color: #F6F3EE; border-radius: 11px; padding: 6px 0">
<p style="margin: 0; font-size: 11px; color: #E3ECF6">{{r.when}}</p>
<p style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2">{{r.day}}</p>
</div>
<div style="flex: 1 1 auto; min-width: 0">
<p style="margin: 0; font-size: 15px; font-weight: 600">{{r.name}}</p>
<p style="margin: 2px 0 0; font-size: 12px; color: #7A6E63">{{r.room}} · {{r.phone}} · {{r.pets}}</p>
<p style="margin: 2px 0 0; font-size: 12px; color: #7A6E63">{{r.emailNote}}</p>
</div>
<template data-sc="if" value="{{r.tag}}" hint-placeholder-val="{{ true }}"><span style="{{r.tagStyle}}">{{r.tag}}</span></template>
</li>
</template>
</ul>
</section>

</div>

<!-- Occupancy calendar -->
<section id="calendar" aria-labelledby="h-cal" style="position: relative; background: #F6F3EE; border-radius: 18px; padding: 24px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
<h2 id="h-cal" style="margin: 0; font-size: 21px; font-weight: 600">ปฏิทินห้องพักรายเดือน</h2>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{prevMonth}}" disabled="{{noPrev}}" aria-label="เดือนก่อนหน้า" style="{{prevStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<span style="font-size: 17px; font-weight: 600; min-width: 150px; text-align: center">{{monthTitle}}</span>
<button type="button" onClick="{{nextMonth}}" disabled="{{noNext}}" aria-label="เดือนถัดไป" style="{{nextStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
</div>
<div style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: #47413A">
<template data-sc="for" list="{{legend}}" as="lg" hint-placeholder-count="5"><span style="display: flex; align-items: center; gap: 6px"><span style="{{lg.dot}}"></span>{{lg.name}}</span></template>
</div>
<p style="margin: 10px 0 0; font-size: 12px; color: #7A6E63">{{checkoutNote}}</p>
<div style="overflow-x: auto; margin-top: 16px">
<div style="min-width: 760px">

<script>
class Component extends DCLogic {
constructor(props) {
super(props);
let seen = '';
try { seen = localStorage.getItem('km_seen') || ''; } catch (e) {}
this.state = { nf: 'all', bf: 'all', q: '', seen, monthOffset: 0, loading: true, loadErr: '', toast: '',
dash: null, bookings: [], acting: '', updated: '', me: kmToken.getUser(),
stRange: '1m', stFrom: '', stTo: '', stats: null, stLoading: false, stErr: '',
pr: null, prLoading: false, prErr: '', roomEdit: {}, rf: null, rfErr: '', pvFrom: '', pv: null,
// แจ้งเตือน: อ่านแล้ว/ลบแล้ว (เก็บในเบราว์เซอร์นี้) · ตารางการจอง: การจองใหม่ที่ยังไม่ได้แตะ
readKeys: this.loadSet('km_read'), dismissed: this.loadSet('km_dismiss'), bkAck: this.loadSet('km_bk_ack'), bkInit: this.hasKey('km_bk_ack'),
calFlash: '', pop: null, notifyMax: '', bookMax: '', dlg: null, ext: null };
}
/* กล่องถามยืนยันในหน้า (ใช้แทน window.confirm กันเผลอคลิก) */
ask(opts) {
this.lastFocus = document.activeElement;
this.setState({ dlg: opts }, () => { const b = document.getElementById('km-dlg-ok'); if (b) b.focus(); });
}
closeDlg(ok) {
const d = this.state.dlg;
this.setState({ dlg: null }, () => { if (this.lastFocus && this.lastFocus.focus && document.contains(this.lastFocus)) this.lastFocus.focus({ preventScroll: true }); });
if (ok && d && d.onOk) d.onOk();
}
/* เพิ่มวันพัก: ตรวจห้องว่างต่อจากวันเช็คเอาท์ ห้องเดิมเต็ม = เลือกห้องอื่น */
openExt(b) {
this.setState({ pop: null, ext: { id: b.id, b, n: '1', info: null, loading: true, err: '', pick: '', busy: false } }, () => { const i = document.getElementById('km-ext-n'); if (i) i.focus(); });
this.loadExt(b.id, 1);
}
loadExt(id, n) {
const req = this.extReq = (this.extReq || 0) + 1;
kmApi('adminExtendInfo', kmToken.get(), id, n).then((info) => {
const e = this.state.ext; if (!e || req !== this.extReq) return;
const ok = (k) => k === info.roomNo ? info.same.free : !info.same.free && info.options.some((o) => o.roomNo === k && o.fits);
const pick = e.pick && ok(e.pick) ? e.pick : info.same.free ? info.roomNo : ((info.options.find((o) => o.fits) || {}).roomNo || '');
this.setState({ ext: Object.assign({}, e, { info, loading: false, err: '', pick }) });
}).catch((er) => {
if (this.fail(er)) return;
const e = this.state.ext; if (!e || req !== this.extReq) return;
this.setState({ ext: Object.assign({}, e, { info: null, loading: false, err: er.message, pick: '' }) });
});
}
setExtN(v) {
const e = this.state.ext; if (!e) return;
const n = Math.max(1, Math.min(30, Math.floor(Number(v)) || 1));
this.setState({ ext: Object.assign({}, e, { n: String(v), loading: true, err: '' }) });
clearTimeout(this.extT);
this.extT = setTimeout(() => this.loadExt(e.id, n), 350);
}
saveExt() {
const e = this.state.ext;
if (!e || !e.info || !e.pick || e.busy || e.loading) return;
const n = Math.max(1, Math.min(30, Math.floor(Number(e.n)) || 1));
this.setState({ ext: Object.assign({}, e, { busy: true, err: '' }) });
kmApi('adminExtendStay', kmToken.get(), e.id, n, e.pick)
.then((msg) => { this.setState({ ext: null }); this.say(msg); this.load(true); })
.catch((er) => { if (this.fail(er)) return; this.setState({ ext: Object.assign({}, this.state.ext, { busy: false, err: er.message }) }); this.loadExt(e.id, n); });
}
toLogin() {
if (typeof window.kmGo === 'function') window.kmGo('login'); else location.replace('login.html');
}
