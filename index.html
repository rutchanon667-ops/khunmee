<style>
body{margin:0;background:#F6F3EE;color:#47413A;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Noto Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#47413A;text-decoration:none}a:hover{text-decoration:underline}
.pill:active,.btn:active{transform:scale(0.95)}
.pill:hover{text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #A1805D;outline-offset:2px}
/* ค้นหาห้องว่าง: มือถือก่อน แล้วขยายเป็นแถวเดียวบนจอใหญ่ */
.finder{width:100%;max-width:980px;box-sizing:border-box;margin-top:8px;display:grid;gap:12px;padding:14px;background:#FFFDF9;border:1px solid #E2D8C6;border-radius:24px;box-shadow:0 10px 30px rgba(71,65,58,.10);text-align:start}
.f-dates{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;background:#F6F3EE;border:1px solid #E2D8C6;border-radius:18px}
.f-date{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 16px;min-width:0;cursor:pointer;border-radius:18px}
.f-date:focus-within,.f-sel:focus-within{outline:2px solid #A1805D;outline-offset:-2px}
.f-k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#7A6E63;letter-spacing:.2px}
.f-v{font-size:22px;font-weight:600;line-height:1.25;color:#3A352F;white-space:nowrap}
.f-s{font-size:13px;color:#7A6E63;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-native{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0;padding:0;margin:0}
.f-native::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.f-nights{font-size:12px;font-weight:600;color:#7D6043;background:#EFE2B4;border-radius:9999px;padding:5px 10px;white-space:nowrap}
.f-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f-sel{position:relative;display:flex;flex-direction:column;gap:2px;padding:10px 16px;background:#F6F3EE;border:1px solid #E2D8C6;border-radius:18px;min-width:0}
.f-sel select{-webkit-appearance:none;appearance:none;width:100%;border:0;background:transparent;font:inherit;font-size:17px;font-weight:600;color:#3A352F;padding:0 22px 0 0;cursor:pointer}
.f-sel select:focus-visible{outline:none}
.f-chev{position:absolute;right:14px;bottom:14px;pointer-events:none}
.f-go{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 32px;border-radius:9999px;background:#47413A;color:#F6F3EE !important;font-size:18px;font-weight:600;white-space:nowrap}
.f-go:hover{background:#3A352F}
@media (min-width:834px){
 .finder{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;align-items:stretch;padding:10px;border-radius:9999px}
 .f-dates,.f-sel{border-radius:9999px}
 .f-date{padding:10px 24px;border-radius:9999px}
 .f-sel{padding:10px 24px;justify-content:center}
 .f-chev{right:20px;bottom:auto;top:50%;margin-top:-2px}
 .f-v{font-size:19px}
 .f-go{min-height:0}
}
@media (max-width:360px){
 .f-date{padding:12px}
 .f-v{font-size:19px}
 .f-sel{padding:10px 12px}
}
/* แท็บเล็ต + มือถือ (ไอแพดแนวตั้ง 768–833px และเล็กกว่า) */
@media (max-width:833px){
 .navlinks{display:none !important}
 .subnav-links{display:none !important}
 .hero-h{font-size:40px !important}
 .tile{padding:64px 24px !important}
 .grid4{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
 .grid3{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
 .gallery{grid-template-columns:repeat(3,minmax(0,1fr)) !important}
 .display{font-size:34px !important}
 .lead{font-size:22px !important}
 .quote-box{padding:56px 32px !important}
 .quote-t{font-size:28px !important}
}
/* มือถือ (ไม่เกิน 600px) */
@media (max-width:600px){
 .subnav-ci{display:none !important}
 .subnav-title{font-size:15px !important;white-space:nowrap}
 .subnav-r{gap:8px !important}
 .subnav-r .pill{white-space:nowrap}
 .hero-h{font-size:34px !important}
 .tile{padding:56px 16px !important}
 .two-col{grid-template-columns:repeat(1,minmax(0,1fr)) !important}
 .grid4{grid-template-columns:repeat(1,minmax(0,1fr)) !important}
 .grid3{grid-template-columns:repeat(1,minmax(0,1fr)) !important}
 .foot-cols{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
 .display{font-size:30px !important}
 .lead{font-size:19px !important}
 .quote-box{padding:48px 20px !important}
 .quote-t{font-size:24px !important}
 .line-fab{padding:12px 14px !important;right:12px !important;bottom:12px !important}
}
/* ไอแพดแนวนอน / จอ 834–1068px */
@media (min-width:834px) and (max-width:1068px){
 .navlinks{gap:18px !important}
 .grid4{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
 .hero-h{font-size:44px !important}
}
</style>
</head>

<script>
class Component extends DCLogic {
componentDidMount() {
kmApi('publicListRooms').then((rooms) => {
const prices = {};
rooms.forEach((r) => { prices[String(r.roomNo)] = Number(r.pricePerNight) || 0; });
this.setState({ prices });
}).catch(() => {});
}
priceOf(no) {
const p = (this.state.prices || {})[no];
return p ? { price: '฿' + kmMoney(p), per: '/ คืน' } : { price: 'สอบถามราคา', per: '' };
}
renderVals() {
const now = new Date();
const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayIso = iso(now);
const fIn = this.state.fIn || kmDate.add(todayIso, 1);
let fOut = this.state.fOut || kmDate.add(fIn, 1);
if (fOut <= fIn) fOut = kmDate.add(fIn, 1);
const n = kmDate.diff(fIn, fOut);
const TH_DF = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const day = (d) => { const p = d.split('-').map(Number); return p[2] + ' ' + TH_M[p[1] - 1]; };
const TH_D = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const sub = (d) => { const k = kmDate.diff(todayIso, d), w = kmDate.weekday(d); return k === 0 ? 'วันนี้ · ' + TH_D[w] : k === 1 ? 'พรุ่งนี้ · ' + TH_D[w] : 'วัน' + TH_DF[w]; };
return {
todayIso, fIn, fOut, minOut: kmDate.add(fIn, 1),
inDay: day(fIn), inSub: sub(fIn), inFull: kmDate.long(fIn),
outDay: day(fOut), outSub: sub(fOut), outFull: kmDate.long(fOut),
nightsLabel: n + ' คืน',
setIn: (e) => { const v = e.target.value; if (!v) return; const st = { fIn: v < todayIso ? todayIso : v }; if (!this.state.fOut || this.state.fOut <= st.fIn) st.fOut = kmDate.add(st.fIn, 1); this.setState(st); },
setOut: (e) => { const v = e.target.value; if (v) this.setState({ fOut: v }); },
openPicker: (e) => { try { if (e.currentTarget.showPicker) e.currentTarget.showPicker(); } catch (_) {} },
noSubmit: (e) => e.preventDefault(),
findHref: 'booking.html?in=' + fIn + '&out=' + fOut,
accent: this.props.accent ?? '#47413A',
rooms: [
