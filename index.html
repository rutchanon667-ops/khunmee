<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khun Mee · Pet Friendly House ที่พักสไตล์ญี่ปุ่น ขอนแก่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&amp;family=IBM+Plex+Sans+Thai:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F3EE;color:#3A352F;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#7D6043}a:hover{color:#5C4630}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #A1805D;outline-offset:2px}
html{scroll-behavior:smooth;scroll-padding-top:120px}
.km-serif{font-family:'Noto Serif Thai',serif}
.km-skip{position:absolute;left:-9999px;top:8px;z-index:50;background:#3A352F;color:#F6F3EE;padding:8px 14px;border-radius:9999px}
.km-skip:focus{left:12px}
/* ส่วนหัว */
.km-head{position:sticky;top:0;z-index:20}
.km-bar1{background:rgba(246,243,238,.96);border-bottom:1px solid #E2D8C6;max-width:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px max(24px,calc((100% - 1240px)/2 + 24px))}
.km-brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:#3A352F;white-space:nowrap}
.km-navlinks{display:flex;align-items:center;gap:28px;font-size:15px}
.km-navlinks a{color:#47413A;text-decoration:none}
.km-navlinks a:hover{color:#7D6043}
.km-bar1-r{display:flex;align-items:center;gap:10px}
.km-line{background:#06C755;color:#FFFFFF !important;border-radius:9999px;padding:6px 14px;font-size:13px;font-weight:600;text-decoration:none}
.km-admin{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:#5E554C;color:#EDE6D7 !important;border-radius:9999px;padding:6px 12px;font-size:13px;text-decoration:none}
.km-bar2{background:rgba(237,230,215,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.km-bar2-in{max-width:1240px;margin:0 auto;padding:8px 24px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:16px}
.km-sublinks{display:flex;gap:24px;font-size:14px}
.km-sublinks a{color:#5E554C;text-decoration:none}
.km-actions{display:flex;align-items:center;gap:8px}
.km-pill{display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border-radius:9999px;font-size:14px;white-space:nowrap;text-decoration:none;box-sizing:border-box}
.km-pill-in{border:1px solid #4F7A52;color:#2F5A33 !important}
.km-pill-map{display:none;gap:5px;border:1px solid #A1805D;background:#FFFDF9;color:#7D6043 !important}
.km-pill-out{border:1px solid #7D6043;color:#7D6043 !important}
.km-pill-rs{border:1px solid #5B4B8A;color:#5B4B8A !important}
.km-pill-book{background:#4F7A52;color:#FFFDF9 !important;font-weight:600}
.km-pill-book:hover{background:#436A46}
/* กล่องค้นหาห้องว่าง */
.km-finder{margin-top:8px;background:#FFFDF9;border:1px solid #E2D8C6;border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(58,53,47,.08)}
.km-finder-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f-tile{position:relative;display:flex;flex-direction:column;gap:2px;background:#F6F3EE;border:1px solid #E2D8C6;border-radius:16px;padding:12px 16px;min-width:0;cursor:pointer}
.f-tile:focus-within{outline:2px solid #A1805D;outline-offset:-2px}
.f-k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#7A6E63}
.f-v{font-size:20px;font-weight:600;color:#3A352F;white-space:nowrap}
.f-s{font-size:13px;color:#7A6E63;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-native{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0;padding:0;margin:0}
.f-native::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.f-sel select{-webkit-appearance:none;appearance:none;width:100%;border:0;background:transparent;font:inherit;font-size:17px;font-weight:600;color:#3A352F;padding:0 22px 0 0;cursor:pointer}
.f-sel select:focus-visible{outline:none}
.f-chev{position:absolute;right:14px;bottom:16px;pointer-events:none}
.f-go{min-height:56px;border-radius:9999px;background:#4F7A52;color:#FFFDF9 !important;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.f-go:hover{background:#436A46}
.f-note{margin:2px 0 0;font-size:14px;color:#5E554C;text-align:center}
.f-note a{color:#5B4B8A;font-weight:600}
.km-book-room:hover{background:#436A46 !important}
.km-tile-link:hover{background:#E4DBC8 !important}
/* ปุ่ม LINE ลอย (มือถือ) */
.km-fab{display:none;position:fixed;right:12px;bottom:12px;z-index:20;align-items:center;gap:8px;background:#06C755;color:#FFFFFF !important;border-radius:9999px;padding:12px 16px;font-size:15px;font-weight:600;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.22)}
@media (max-width:1100px){.km-navlinks{gap:18px;font-size:14px}}
@media (max-width:960px){.km-pill-map{display:inline-flex}.km-navlinks{display:none}.km-sublinks{display:none}.km-bar2-in{justify-content:flex-end}}
@media (max-width:860px){
 .km-hero{grid-template-columns:minmax(0,1fr) !important}
 .km-hero-img{min-height:320px !important}
 .km-rooms{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
 .km-pets{grid-template-columns:minmax(0,1fr) !important}
 .km-foot{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
 .km-h1{font-size:40px !important}
 .km-h2{font-size:30px !important}
}
@media (max-width:600px){
 .km-bar1-r .km-line{display:none}
 .km-bar1{padding:10px 16px}
 .km-fab{display:flex}
 .km-bar2-in{padding:8px 12px;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
 .km-bar2-in::-webkit-scrollbar{display:none}
 .km-pill{min-height:34px;padding:0 12px;font-size:13px}
 .km-pill-book{order:-2}
 .km-pill-map{order:-1}
 .km-h1{font-size:34px !important}
 #pets>div{padding:40px 22px !important}
 .km-quote{padding:32px 22px !important}
 .km-quote p.km-serif{font-size:23px !important}
}
@media (max-width:520px){
 .km-brand span+span{display:none}
 .km-rooms{grid-template-columns:minmax(0,1fr) !important}
 .km-finder-row{gap:8px}
 .f-tile .f-s{font-size:12px;white-space:normal;line-height:1.4}
}
.km-swipe-hint{display:none}
@media (max-width:600px){
 .km-swipe{--g:24px;display:flex !important;flex-direction:row !important;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px !important;margin-left:calc(-1*var(--g));margin-right:calc(-1*var(--g));padding:0 var(--g) 8px !important;scroll-padding:0 var(--g);scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
 .km-swipe::-webkit-scrollbar{display:none}
 .km-swipe>*{flex:0 0 80%;min-width:0;scroll-snap-align:start;box-sizing:border-box}
 .km-swipe-sm>*{flex-basis:72%}
 #pets .km-swipe{--g:22px}
 .km-swipe-hint{display:block;margin:20px 0 -16px;text-align:right;font-size:13px;color:#7D6043}
 #top{padding:28px 24px 24px !important}
 .km-hero{gap:24px !important}
 .km-hero-img{min-height:220px !important}
 #rooms,#living{padding-top:56px !important}
 #map{padding-top:56px !important}
 #pets{margin-top:40px !important}
 #pets .km-pets{gap:24px !important}
 .km-quote-box{min-height:300px !important}
 section[aria-label="คำพูดจากเจ้าของบ้าน"]{margin-top:40px !important}
 #map figure{margin-top:20px !important;padding:10px !important}
 #tour{padding-top:20px !important}
 #tour+#top{padding-top:24px !important}
 #tour>div:last-child{border-radius:18px !important}
 .km-tour-sound{top:10px !important;right:10px !important;padding:8px 13px !important;font-size:14px !important}
 #contact{margin-top:56px !important}
 .km-foot{padding:36px 24px 24px !important;gap:24px !important}
}
@media (max-width:600px){
 .km-lookup{padding:14px !important}
 .km-lookup #h-lookup{font-size:15px !important}
 .km-lookup button[aria-controls]{gap:10px !important}
 .km-lookup input{font-size:15px !important;padding:0 10px !important;letter-spacing:0 !important}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* แกลเลอรีพื้นที่ส่วนกลาง: จอคอมชี้เมาส์ให้รูปขยาย · มือถือแตะเพื่อขยาย แตะซ้ำเพื่อดูเต็มจอ */
.km-strip{margin-top:32px;display:flex;gap:8px;height:400px}
.km-strip-i{position:relative;flex:1 1 0;min-width:0;padding:0;border:0;border-radius:18px;overflow:hidden;background:#E2D8C6;cursor:pointer;transition:flex-grow .5s ease}
.km-strip-i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.km-strip-i:focus-visible{flex-grow:5}
@media (hover:hover){.km-strip-i:hover{flex-grow:5}}
@media (hover:none){.km-strip-i.on{flex-grow:7}}
@media (max-width:600px){.km-strip{height:280px;gap:6px;margin-top:24px}.km-strip-i{border-radius:14px}}
@media (prefers-reduced-motion:reduce){.km-strip-i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="view">
<div style="width: 100%">
<a class="km-skip" href="#top">ข้ามไปที่เนื้อหา</a>
<header class="km-head">
<div class="km-bar1">
<a href="#top" class="km-brand"><span class="km-serif" style="font-size: 24px; font-weight: 700; letter-spacing: 0.5px">Khun Mee</span><span style="font-size: 12px; color: #7A6E63; letter-spacing: 1.5px">PET FRIENDLY HOUSE</span></a>
<nav aria-label="เมนูหลัก" class="km-navlinks">
<a href="#rooms">ห้องพัก</a>
<a href="#pets">สำหรับสัตว์เลี้ยง</a>
<a href="#living">พื้นที่ส่วนกลาง</a>
<a href="#map" style="display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7D6043" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>แผนที่</a>
<a href="#contact">ติดต่อ</a>
</nav>
<div class="km-bar1-r">
<a href="https://lin.ee/9aJsfpw" target="_blank" rel="noopener" class="km-line">LINE</a>
<a href="login.html" class="km-admin"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#EDE6D7" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>แอดมิน</a>
</div>
</div>
<div class="km-bar2">
<div class="km-bar2-in">
<nav aria-label="เมนูย่อย" class="km-sublinks">
<a href="#top">ภาพรวม</a>
<a href="#rooms">เปรียบเทียบห้อง</a>
<a href="#pet-rules">กติกาสัตว์เลี้ยง</a>
</nav>
<div class="km-actions">
<a class="km-pill km-pill-map" href="#map"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>แผนที่</a>
<a class="km-pill km-pill-in" href="checkin.html">เช็คอิน</a>
<a class="km-pill km-pill-out" href="checkout.html">เช็คเอาท์</a>
<a class="km-pill km-pill-rs" href="reschedule.html">เลื่อนวันพัก</a>
<a class="km-pill km-pill-book" href="booking.html">จองห้องพัก</a>
</div>
</div>
</div>
</header>

<main>
<template data-sc="if" value="{{tour.on}}" hint-placeholder-val="{{ false }}">
<section id="tour" aria-label="วิดีโอชมบรรยากาศ" style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 0">
<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 28px; overflow: hidden; background: #3A352F">
<template data-sc="if" value="{{tour.playing}}" hint-placeholder-val="{{ false }}"><iframe id="km-tour-frame" src="{{tour.embed}}" title="วิดีโอชมบรรยากาศ Khun Mee" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0"></iframe></template>
<template data-sc="if" value="{{tour.muted}}" hint-placeholder-val="{{ false }}"><button type="button" class="km-tour-sound" onClick="{{tour.unmute}}" aria-label="เปิดเสียงวิดีโอ" style="position: absolute; top: 16px; right: 16px; z-index: 2; display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 0; border-radius: 9999px; background: rgba(255,253,249,.94); color: #3A352F; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.22)"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#3A352F"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="#3A352F" stroke-width="2" fill="none" stroke-linecap="round"></path></svg>เปิดเสียง</button></template>
<template data-sc="if" value="{{tour.poster}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{tour.play}}" aria-label="เล่นวิดีโอชมบรรยากาศ" style="position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: #3A352F; cursor: pointer">
<img src="{{tour.thumb}}" alt="" style="width: 100%; height: 100%; object-fit: cover; opacity: .85; display: block">
<span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 9999px; background: rgba(255,253,249,.94); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 24px rgba(0,0,0,.25)"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#3A352F"></path></svg></span>
</button></template>
</div>
</section>
</template>
<section id="top" style="max-width: 1240px; margin: 0 auto; padding: 56px 24px 40px">
<div class="km-hero" style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 48px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #7D6043; letter-spacing: 1px">
<span style="width: 28px; height: 1px; background: #A1805D" aria-hidden="true"></span>ที่พักสไตล์ญี่ปุ่น · เป็นมิตรกับสัตว์เลี้ยง</p>
<h1 class="km-serif km-h1" style="margin: 0; font-size: 56px; font-weight: 700; line-height: 1.25; color: #3A352F">บ้านที่น้องหมาน้องแมว<br>ก็คือแขกคนสำคัญ</h1>
<p style="margin: 0; font-size: 19px; font-weight: 300; line-height: 1.7; color: #5E554C; max-width: 480px">พักผ่อนอย่างอบอุ่นในบ้านไม้โทนญี่ปุ่น พร้อมพาสมาชิกสี่ขาของคุณมาด้วยได้ทุกห้อง</p>

<form id="book" class="km-finder" aria-label="ค้นหาห้องว่าง" onSubmit="{{noSubmit}}">
<div class="km-finder-row">
<label class="f-tile f-date"><span class="f-k"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A1805D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>เช็คอิน</span><span class="f-v">{{inDay}}</span><span class="f-s">{{inSub}} · ตั้งแต่ 14:00</span>
<input class="f-native" type="date" name="in" value="{{fIn}}" onChange="{{setIn}}" onClick="{{openPicker}}" min="{{todayIso}}" aria-label="วันเช็คอิน {{inFull}}"></label>
<label class="f-tile f-date"><span class="f-k"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A1805D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>เช็คเอาท์</span><span class="f-v">{{outDay}}</span><span class="f-s">{{outSub}} · ถึง 12:00</span>
<input class="f-native" type="date" name="out" value="{{fOut}}" onChange="{{setOut}}" onClick="{{openPicker}}" min="{{minOut}}" aria-label="วันเช็คเอาท์ {{outFull}}"></label>
<label class="f-tile f-sel"><span class="f-k">ผู้เข้าพัก</span><select name="guests"><option>2 ท่าน</option><option>1 ท่าน</option><option>3 ท่าน</option></select><svg class="f-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A6E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></label>
<label class="f-tile f-sel"><span class="f-k">สัตว์เลี้ยง</span><select name="pets"><option>สุนัข 1 ตัว</option><option>แมว 1 ตัว</option><option>2 ตัว</option><option>ไม่มี</option></select><svg class="f-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A6E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></label>
</div>
<a class="f-go" href="{{findHref}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>ค้นหาห้องว่าง · {{nightsLabel}}</a>
<p class="f-note">จองไว้แล้วแต่อยากเปลี่ยนวัน? <a href="reschedule.html">เลื่อนวันพักได้ 1 ครั้ง ›</a></p>
</form>
<section id="lookup" class="km-lookup" aria-labelledby="h-lookup" style="background: #FFFDF9; border: 1px solid #E2D8C6; border-radius: 20px; padding: 16px 18px">
<button type="button" onClick="{{lk.toggle}}" aria-expanded="{{lk.open}}" aria-controls="lk-form" style="width: 100%; display: flex; align-items: center; gap: 14px; background: transparent; border: 0; padding: 0; text-align: left; color: #3A352F; font-family: inherit; cursor: pointer">
<span style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 9999px; background: #EDE6D7; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7D6043" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span id="h-lookup" style="font-size: 16px; font-weight: 600">จองไว้แล้ว? ดูสถานะและใบเสร็จ</span><span style="font-size: 13px; color: #7A6E63">กรอกรหัสการจองและเบอร์โทรที่ใช้จอง</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A6E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{lk.chevStyle}}"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<template data-sc="if" value="{{lk.open}}" hint-placeholder-val="{{ false }}">
<form id="lk-form" onSubmit="{{lk.submit}}" style="margin-top: 14px; display: flex; flex-direction: column; gap: 12px">

<script>
class Component extends DCLogic {
componentDidMount() {
window.addEventListener('km-gallery', () => { this.setState({ gv: Date.now() }); setTimeout(() => this.tourWatch(), 0); });
/* มือถือ: แตะรูปที่ยังไม่ขยายในแกลเลอรีพื้นที่ส่วนกลาง = ขยายรูปนั้นก่อน (ไม่เปิดเต็มจอ) */
document.addEventListener('click', (e) => {
const b = e.target.closest && e.target.closest('.km-strip-i');
if (!b || b.classList.contains('on')) return;
let touch = false;
try { touch = matchMedia('(hover: none)').matches; } catch (_) {}
if (!touch) return;
e.preventDefault(); e.stopPropagation();
this.setState({ livOn: Number(b.getAttribute('data-strip')) || 0 });
}, true);
setTimeout(() => this.tourWatch(), 0);
kmApi('publicListRooms').then((rooms) => {
const prices = {};
const names = {};
rooms.forEach((r) => { prices[String(r.roomNo)] = Number(r.pricePerNight) || 0; if (String(r.name || '').trim()) names[String(r.roomNo)] = String(r.name).trim(); });
this.setState({ prices, names });
}).catch(() => {});
}
/* ดูสถานะและใบเสร็จ: ส่งรหัสการจอง + เบอร์โทรไปหน้าจองผ่าน sessionStorage (ไม่ใส่เบอร์ในลิงก์) */
lookup() {
const code = String(this.state.lkCode || '').toUpperCase().replace(/\s+/g, '');
const phone = String(this.state.lkPhone || '').trim();
if (!/^[A-Z0-9]{6,30}$/.test(code)) return this.setState({ lkErr: 'กรุณากรอกรหัสการจองให้ถูกต้อง เช่น KM261118ABCD' });
if (phone.replace(/[^0-9]/g, '').length < 9) return this.setState({ lkErr: 'กรุณากรอกเบอร์โทรที่ใช้จอง 9–10 หลัก' });
try { sessionStorage.setItem('km_lookup', JSON.stringify({ code, phone, t: Date.now() })); } catch (e) {}
location.href = 'booking.html?code=' + encodeURIComponent(code) + '#lookup';
}
/* วิดีโอชมบรรยากาศ: เล่นเอง (ปิดเสียง) เมื่อเลื่อนมาถึง และหยุดเมื่อเลื่อนผ่าน · ปิดเล่นอัตโนมัติถ้าผู้ใช้ตั้งลดภาพเคลื่อนไหวหรือประหยัดเน็ต */
tourWatch() {
const el = document.getElementById('tour');
if (!el || el === this._tourEl || !('IntersectionObserver' in window)) return;
if (this._tourObs) this._tourObs.disconnect();
this._tourEl = el;
let noAuto = false;
try { noAuto = matchMedia('(prefers-reduced-motion: reduce)').matches || !!(navigator.connection && navigator.connection.saveData); } catch (e) {}
if (noAuto) return;
this._tourObs = new IntersectionObserver((ents) => {
const e = ents[ents.length - 1];
const id = window.kmGallery ? kmGallery.tourId() : '';
if (!id) return;
if (e.isIntersecting) {
if (this.state.tourPlay !== id) this.setState({ tourPlay: id, tourAuto: true, tourMuted: true });
else this.tourCmd('playVideo');
} else if (this.state.tourPlay === id) this.tourCmd('pauseVideo');
}, { threshold: 0.5 });
this._tourObs.observe(el);
}
tourCmd(func, args) {
const f = document.getElementById('km-tour-frame');
if (f && f.contentWindow) f.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: args || [] }), '*');
}
priceOf(no) {
const p = (this.state.prices || {})[no];
return p ? { price: 'เริ่ม ฿' + kmMoney(p), per: '/ คืน' } : { price: 'สอบถามราคา', per: '' };
}
renderVals() {
const now = new Date();
const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayIso = iso(now);
const fIn = this.state.fIn || kmDate.add(todayIso, 1);
let fOut = this.state.fOut || kmDate.add(fIn, 1);
if (fOut <= fIn) fOut = kmDate.add(fIn, 1);
const n = kmDate.diff(fIn, fOut);
const TH_DF = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const day = (d) => { const p = d.split('-').map(Number); return p[2] + ' ' + TH_M[p[1] - 1]; };
const TH_D = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const sub = (d) => { const k = kmDate.diff(todayIso, d), w = kmDate.weekday(d); return k === 0 ? 'วันนี้ · ' + TH_D[w] : k === 1 ? 'พรุ่งนี้ · ' + TH_D[w] : 'วัน' + TH_DF[w]; };
return {
todayIso, fIn, fOut, minOut: kmDate.add(fIn, 1),
inDay: day(fIn), inSub: sub(fIn), inFull: kmDate.long(fIn),
outDay: day(fOut), outSub: sub(fOut), outFull: kmDate.long(fOut),
nightsLabel: n + ' คืน',
setIn: (e) => { const v = e.target.value; if (!v) return; const st = { fIn: v < todayIso ? todayIso : v }; if (!this.state.fOut || this.state.fOut <= st.fIn) st.fOut = kmDate.add(st.fIn, 1); this.setState(st); },
setOut: (e) => { const v = e.target.value; if (v) this.setState({ fOut: v }); },
openPicker: (e) => { try { if (e.currentTarget.showPicker) e.currentTarget.showPicker(); } catch (_) {} },
noSubmit: (e) => e.preventDefault(),
lk: { open: !!this.state.lkOpen, code: this.state.lkCode || '', phone: this.state.lkPhone || '', err: this.state.lkErr || '',
chevStyle: 'flex: 0 0 18px; transition: transform .2s; transform: rotate(' + (this.state.lkOpen ? 180 : 0) + 'deg)',
toggle: () => this.setState({ lkOpen: !this.state.lkOpen, lkErr: '' }), openNow: () => this.setState({ lkOpen: true }),
setCode: (e) => this.setState({ lkCode: e.target.value, lkErr: '' }), setPhone: (e) => this.setState({ lkPhone: e.target.value, lkErr: '' }),
submit: (e) => { e.preventDefault(); this.lookup(); } },
findHref: 'booking.html?in=' + fIn + '&out=' + fOut,
home: {
hero: window.kmGallery ? kmGallery.single('hero', 'images/exterior-day.jpg') : 'images/exterior-day.jpg',
quote: window.kmGallery ? kmGallery.single('quote', 'images/exterior-night.jpg') : 'images/exterior-night.jpg',
map: window.kmGallery ? kmGallery.single('map', 'images/map-khunmee.jpg') : 'images/map-khunmee.jpg'
},
tour: (() => {
const id = window.kmGallery ? kmGallery.tourId() : '';
const playing = !!id && this.state.tourPlay === id;
const auto = playing && !!this.state.tourAuto;
const embed = !id ? '' : kmGallery.ytEmbed(id, true) + '&enablejsapi=1' + (auto ? '&mute=1&loop=1&playlist=' + id : '');
return { on: !!id, playing, poster: !!id && !playing, thumb: id ? kmGallery.ytThumb(id) : '', embed, muted: auto && !!this.state.tourMuted,
play: () => this.setState({ tourPlay: id, tourAuto: false, tourMuted: false }),
unmute: () => { this.tourCmd('unMute'); this.tourCmd('setVolume', [100]); this.tourCmd('playVideo'); this.setState({ tourMuted: false }); } };
})(),
livingCount: (window.kmGallery ? kmGallery.living() : ((window.KM_CONFIG || {}).LIVING_GALLERY || [])).length || 1,
livStrip: (() => {
const ALT = { 'images/reception-1.jpg': 'โถงต้อนรับผนังหินขัดกรอบไม้ และเคาน์เตอร์ไม้', 'images/reception-2.jpg': 'มุมนั่งเล่นโซฟาผ้าลินิน', 'images/reception-3.jpg': 'เคาน์เตอร์ครัวไม้โค้งพร้อมเก้าอี้บาร์', 'images/reception-4.jpg': 'พื้นที่ส่วนกลาง', 'images/bathroom-1.jpg': 'ห้องน้ำพร้อมเรนชาวเวอร์และกระจกส่องหน้า', 'images/bathroom-2.jpg': 'ห้องน้ำ' };
const L = (window.kmGallery ? kmGallery.living() : ((window.KM_CONFIG || {}).LIVING_GALLERY || [])).filter((x) => !/^yt:/.test(String(x))).slice(0, 8);
const on = Math.min(this.state.livOn || 0, Math.max(0, L.length - 1));
return L.map((src, i) => ({ i: String(i), src, alt: ALT[src] || 'พื้นที่ส่วนกลาง', cls: 'km-strip-i' + (i === on ? ' on' : '') }));
})(),
rooms: [
{ code: 'ROOM 01', name: 'ห้องโชจิ', img: 'images/room-shoji.jpg', alt: 'ห้องโชจิ หัวเตียงลายตารางแบบประตูโชจิ', desc: 'หัวเตียงลายตารางแบบบานโชจิ ม้านั่งปลายเตียง และมุมเก้าอี้อ่านหนังสือ' },
{ code: 'ROOM 02', name: 'ห้องฮิโนกิ', img: 'images/room-hinoki.jpg', alt: 'ห้องฮิโนกิ ผนังไม้และไฟหัวเตียง', desc: 'ผนังไม้ระแนงพร้อมไฟหัวเตียงอุ่น ๆ และโต๊ะทำงานติดหน้าต่าง' },
{ code: 'ROOM 03', name: 'ห้องยาเนะ', img: 'images/room-yane-1.jpg', alt: 'ห้องยาเนะ เพดานทรงจั่ว', desc: 'เพดานทรงจั่วสูงโปร่ง ผนังไม้ระแนง และโต๊ะเครื่องแป้งริมหน้าต่าง' },
{ code: 'ROOM 04', name: 'ห้องโคโมเรบิ', img: 'images/room-komorebi.jpg', alt: 'ห้องโคโมเรบิ หัวเตียงบุผ้าและกระจกทรงกลม', desc: 'หัวเตียงบุผ้านุ่ม กระจกทรงกลม ตู้เสื้อผ้า และทีวีสำหรับคืนสบาย ๆ' }
].map((r, i) => { const nm = (this.state.names || {})[String(i + 1)]; const o = Object.assign({}, r, this.priceOf(String(i + 1))); if (nm && nm !== r.name) { o.alt = nm + ' · ' + r.alt.replace(r.name, '').trim(); o.name = nm; } o.no = String(i + 1); o.img = window.kmRoomImage ? kmRoomImage(o.no) : o.img; const all = window.kmGallery ? kmGallery.roomList(o.no) : [o.img]; const nv = all.filter((x) => /^yt:/.test(x)).length; o.photos = all.length; o.tag = (all.length - nv) + ' รูป' + (nv ? ' · ▶ วิดีโอ ' + nv : ''); return o; })
};
}
}
DC.mount(Component, {});
</script>
