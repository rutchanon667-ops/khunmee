<script>
class Component extends DCLogic {
componentDidMount() {
kmApi('publicListRooms').then((rooms) => {
const prices = {};
rooms.forEach((r) => { prices[String(r.roomNo)] = Number(r.pricePerNight) || 0; });
this.setState({ prices });
}).catch(() => {});
}
priceOf(no) {
const p = (this.state.prices || {})[no];
return p ? { price: '฿' + kmMoney(p), per: '/ คืน' } : { price: 'สอบถามราคา', per: '' };
}
renderVals() {
const now = new Date();
const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayIso = iso(now);
const fIn = this.state.fIn || kmDate.add(todayIso, 1);
let fOut = this.state.fOut || kmDate.add(fIn, 1);
if (fOut <= fIn) fOut = kmDate.add(fIn, 1);
return {
todayIso, fIn, fOut,
setIn: (e) => this.setState({ fIn: e.target.value }),
setOut: (e) => this.setState({ fOut: e.target.value }),
findHref: 'booking.html?in=' + fIn + '&out=' + fOut,
accent: this.props.accent ?? '#47413A',
rooms: [
{ code: 'ROOM 01', name: 'ห้องโชจิ', img: 'images/room-shoji.jpg', alt: 'ห้องโชจิ หัวเตียงลายตารางแบบประตูโชจิ', desc: 'หัวเตียงลายตารางแบบบานโชจิ ม้านั่งปลายเตียง และมุมเก้าอี้อ่านหนังสือ' },
{ code: 'ROOM 02', name: 'ห้องฮิโนกิ', img: 'images/room-hinoki.jpg', alt: 'ห้องฮิโนกิ ผนังไม้และไฟหัวเตียง', desc: 'ผนังไม้ระแนงพร้อมไฟหัวเตียงอุ่น ๆ และโต๊ะทำงานติดหน้าต่าง' },
{ code: 'ROOM 03', name: 'ห้องยาเนะ', img: 'images/room-yane-1.jpg', alt: 'ห้องยาเนะ เพดานทรงจั่ว', desc: 'เพดานทรงจั่วสูงโปร่ง ผนังไม้ระแนง และโต๊ะเครื่องแป้งริมหน้าต่าง' },
{ code: 'ROOM 04', name: 'ห้องโคโมเรบิ', img: 'images/room-komorebi.jpg', alt: 'ห้องโคโมเรบิ หัวเตียงบุผ้าและกระจกทรงกลม', desc: 'หัวเตียงบุผ้านุ่ม กระจกทรงกลม ตู้เสื้อผ้า และทีวีสำหรับคืนสบาย ๆ' }
].map((r, i) => Object.assign(r, this.priceOf(String(i + 1))))
};
}
}
DC.mount(Component, {"accent": "#47413A"});
</script>
