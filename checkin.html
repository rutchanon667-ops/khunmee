<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khun Mhee – เช็คอินด้วยตัวเอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;family=Noto+Sans+Thai:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDE6D7;color:#47413A;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Noto Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#47413A;text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
button:active:not(:disabled),.pill:active{transform:scale(0.95)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.upl:focus-within{outline:2px solid #A1805D;outline-offset:2px}
input,select,textarea{font-family:inherit}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:833px){
 .navlinks{display:none !important}
 .fields2{grid-template-columns:repeat(1,minmax(0,1fr)) !important}
 .page-h{font-size:34px !important}
 .lead{font-size:19px !important}
 .door{font-size:44px !important;letter-spacing:6px !important}
 .card{padding:24px 20px !important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="view">
<div style="width: 100%; min-width: 0; background: #EDE6D7; min-height: 100vh">

<header style="background: #3A352F; color: #F6F3EE; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0 20px; box-sizing: border-box">
<nav aria-label="เมนูหลัก" style="width: 100%; max-width: 1024px; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-size: 12px">
<a href="index.html" style="color: #F6F3EE; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#DCC881" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="10" r="2"></circle><circle cx="9.5" cy="5.5" r="2"></circle><circle cx="14.5" cy="5.5" r="2"></circle><circle cx="18.5" cy="10" r="2"></circle><path d="M12 12c-3 0-5.5 3.5-5.5 6 0 1.6 1.3 2.5 2.8 2.5 1.1 0 1.8-.6 2.7-.6s1.6.6 2.7.6c1.5 0 2.8-.9 2.8-2.5 0-2.5-2.5-6-5.5-6z"></path></svg>
Khun Mhee</a>
<div class="navlinks" style="display: flex; gap: 32px">
<a href="index.html" style="color: #EDE6D7">ห้องพัก</a>
<a href="booking.html" style="color: #EDE6D7">จองห้องพัก</a>
<a href="checkin.html" aria-current="page" style="color: #FFFFFF; font-weight: 600">เช็คอิน</a>
<a href="checkout.html" style="color: #EDE6D7">เช็คเอาท์</a>
<a href="index.html#contact" style="color: #EDE6D7">ติดต่อเรา</a>
</div>
<a href="login.html" style="color: #EDE6D7">แอดมิน</a>
</nav>
</header>

<main style="max-width: 760px; margin: 0 auto; padding: 56px 20px 80px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div>
<a href="index.html" style="font-size: 14px; color: #47413A">‹ กลับหน้าแรก</a>
<h1 class="page-h" style="margin: 12px 0 0; font-size: 48px; font-weight: 600; line-height: 1.2; letter-spacing: -0.28px">{{pageTitle}}</h1>
</div>

<template data-sc="if" value="{{showLead}}" hint-placeholder-val="{{ true }}">
<div role="note" style="display: flex; gap: 18px; align-items: flex-start; background: #E7EFE4; border: 2px solid #4F7A52; border-radius: 18px; padding: 24px 26px; box-sizing: border-box">
<span style="width: 52px; height: 52px; flex: 0 0 52px; border-radius: 9999px; background: #4F7A52; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M10.8 12.2L20 3M16 7l3 3M14 9l2 2"></path></svg></span>
<p class="lead" style="margin: 0; font-size: 23px; font-weight: 600; line-height: 1.55; color: #2F5A33">กรอกรหัสการจองและเบอร์โทร แล้วรับรหัสประตูทาง LINE ได้ทันทีในวันเข้าพัก ไม่ต้องรอเจ้าหน้าที่</p>
</div>
</template>

<!-- 1. ค้นหาการจอง -->
<template data-sc="if" value="{{showFind}}" hint-placeholder-val="{{ true }}">
<section class="card" aria-labelledby="h-find" style="background: #F6F3EE; border-radius: 18px; padding: 32px; box-sizing: border-box">
<h2 id="h-find" style="margin: 0; font-size: 24px; font-weight: 600">เช็คอินด้วยรหัสการจอง</h2>
<p style="margin: 6px 0 0; font-size: 14px; color: #5E554C">รหัสการจองอยู่ในหน้ายืนยันการจองและอีเมลยืนยัน เช่น KM261103ABCD กดปุ่มแล้วเช็คอินได้เลย รหัสประตูรับทาง LINE</p>
<form onSubmit="{{find}}" style="margin-top: 24px">
<div class="fields2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">รหัสการจอง *
<input id="ci-code" type="text" value="{{code}}" onInput="{{setCode}}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="เช่น KM261103ABCD" style="height: 52px; border: 1px solid #CFC3AC; border-radius: 11px; padding: 0 14px; font-size: 18px; font-weight: 400; color: #47413A; background: #FFFDF9; text-transform: uppercase; letter-spacing: 0.5px; box-sizing: border-box">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">เบอร์โทรศัพท์ที่ใช้ตอนจอง *
<input type="tel" value="{{phone}}" onInput="{{setPhone}}" autocomplete="tel" placeholder="08X-XXX-XXXX" style="height: 52px; border: 1px solid #CFC3AC; border-radius: 11px; padding: 0 14px; font-size: 18px; font-weight: 400; color: #47413A; background: #FFFDF9; box-sizing: border-box">
</label>
</div>
<template data-sc="if" value="{{findErr}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 16px 0 0; background: #FFFDF9; border: 1px solid #C88193; border-radius: 11px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #9A4E60">{{findErr}}</p></template>
<div style="display: flex; justify-content: flex-end; margin-top: 24px">
<button type="submit" disabled="{{busy}}" style="background: #4F7A52; color: #FFFFFF; border: 0; border-radius: 9999px; padding: 14px 32px; font-size: 18px; font-weight: 600">{{findLabel}}</button>
</div>
</form>
</section>
</template>

<!-- 2. การจองที่พบ -->
<template data-sc="if" value="{{hasInfo}}" hint-placeholder-val="{{ false }}">
<section aria-labelledby="h-bk" style="background: #F6F3EE; border-radius: 18px; padding: 24px 28px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<div style="flex: 1 1 280px; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap"><span style="font-size: 13px; color: #5E554C">รหัสการจอง</span><span style="font-size: 18px; font-weight: 600; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; color: #47413A">{{bk.code}}</span><button type="button" onClick="{{copyBk}}" aria-label="คัดลอกรหัสการจอง {{bk.code}}" style="display: flex; align-items: center; gap: 6px; background: #FFFDF9; color: #47413A; border: 1px solid #CFC3AC; border-radius: 9999px; padding: 6px 14px; font-size: 14px; min-height: 36px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>{{copyBkLabel}}</button></div>
<h2 id="h-bk" style="margin: 2px 0 0; font-size: 22px; font-weight: 600">{{bk.room}}</h2>
<p style="margin: 4px 0 0; font-size: 16px">{{bk.dates}}</p>
</div>
<span style="{{bk.chipStyle}}">{{bk.chip}}</span>
<button type="button" onClick="{{again}}" style="background: transparent; color: #47413A; border: 1px solid #CFC3AC; border-radius: 9999px; padding: 9px 18px; font-size: 14px">ค้นหาการจองอื่น</button>
</section>
</template>

<!-- ยังเช็คอินไม่ได้ / จบแล้ว -->
<template data-sc="if" value="{{blockedMsg}}" hint-placeholder-val="{{ false }}">
<section class="card" style="background: #F6F3EE; border-radius: 18px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<p role="status" style="margin: 0; font-size: 17px; line-height: 1.6; color: #47413A">{{blockedMsg}}</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap">
<template data-sc="if" value="{{canRecheck}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{recheck}}" disabled="{{busy}}" style="background: #4F7A52; color: #FFFFFF; border: 0; border-radius: 9999px; padding: 11px 22px; font-size: 16px; font-weight: 600">{{recheckLabel}}</button></template>
<a class="pill" href="index.html#contact" style="background: transparent; color: #47413A; border: 1px solid #47413A; border-radius: 9999px; padding: 10px 22px; font-size: 16px">ติดต่อที่พัก</a>
</div>
</section>
</template>

<!-- 3. พร้อมเช็คอิน (เปิดหน้าจากข้อมูลที่จำไว้ ยังไม่ได้กดเช็คอิน) -->
<template data-sc="if" value="{{canCheckin}}" hint-placeholder-val="{{ false }}">
<section class="card" aria-labelledby="h-form" style="background: #F6F3EE; border-radius: 18px; padding: 28px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<div style="flex: 1 1 260px; min-width: 0">
<h2 id="h-form" tabindex="-1" style="margin: 0; font-size: 22px; font-weight: 600">พร้อมเช็คอินแล้ว{{firstName}}</h2>
<p style="margin: 6px 0 0; font-size: 15px; line-height: 1.6; color: #5E554C">กดปุ่มเพื่อเช็คอิน แล้วรับรหัสประตูทาง LINE</p>
</div>
<button type="button" onClick="{{submit}}" disabled="{{busy}}" style="flex: 0 0 auto; background: #4F7A52; color: #FFFFFF; border: 0; border-radius: 9999px; padding: 15px 30px; font-size: 18px; font-weight: 600">{{submitLabel}}</button>
<template data-sc="if" value="{{formErr}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; flex: 1 1 100%; background: #FFFDF9; border: 1px solid #C88193; border-radius: 11px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #9A4E60">{{formErr}}</p></template>
</section>
</template>

<!-- 3b. ลงทะเบียนผู้เข้าพัก (ต้องยืนยันบัตรก่อนรับรหัสประตู · SC_REQUIRE_ID) -->
<template data-sc="if" value="{{idForm}}" hint-placeholder-val="{{ false }}">
<section class="card" aria-labelledby="h-form" style="background: #F6F3EE; border-radius: 18px; padding: 28px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<div>
<h2 id="h-form" tabindex="-1" style="margin: 0; font-size: 22px; font-weight: 600">พร้อมเช็คอินแล้ว{{firstName}}</h2>
<p style="margin: 6px 0 0; font-size: 15px; line-height: 1.6; color: #5E554C">ที่พักต้องลงทะเบียนผู้เข้าพักตามกฎหมาย กรอกเลขบัตรและถ่ายรูปบัตร แล้วรับรหัสประตูทาง LINE ได้ทันที</p>
</div>
<div role="radiogroup" aria-label="ประเภทบัตร" class="fields2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button type="button" role="radio" aria-checked="{{idf.thai}}" onClick="{{pickThai}}" style="{{idf.thaiStyle}}"><span style="font-size: 17px; font-weight: 600; color: #47413A">คนไทย</span><span style="font-size: 13px; color: #5E554C">บัตรประชาชน 13 หลัก</span></button>
<button type="button" role="radio" aria-checked="{{idf.foreign}}" onClick="{{pickForeign}}" style="{{idf.foreignStyle}}"><span style="font-size: 17px; font-weight: 600; color: #47413A">ชาวต่างชาติ</span><span style="font-size: 13px; color: #5E554C">พาสปอร์ต · Passport</span></button>
</div>
<div class="fields2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
<template data-sc="if" value="{{idf.foreign}}" hint-placeholder-val="{{ false }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">สัญชาติ · Nationality *
<input type="text" value="{{idf.nationality}}" onInput="{{setNationality}}" autocomplete="country-name" placeholder="เช่น Japanese" style="height: 52px; border: 1px solid #CFC3AC; border-radius: 11px; padding: 0 14px; font-size: 17px; font-weight: 400; color: #47413A; background: #FFFDF9; box-sizing: border-box">
</label>
</template>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">{{idf.noLabel}} *
<input id="ci-idno" type="text" value="{{idf.idNumber}}" onInput="{{setIdNo}}" inputmode="{{idf.inputMode}}" autocomplete="off" spellcheck="false" placeholder="{{idf.noHint}}" style="height: 52px; border: 1px solid #CFC3AC; border-radius: 11px; padding: 0 14px; font-size: 18px; font-weight: 400; color: #47413A; background: #FFFDF9; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; box-sizing: border-box">
</label>
</div>
<label style="{{idf.photoBox}}">
<input type="file" accept="image/*" onChange="{{setPhoto}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#47413A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<span style="font-size: 15px; font-weight: 600">{{idf.photoLabel}}</span>
<span style="font-size: 13px; color: #5E554C">{{idf.photoSub}}</span>
</label>
<button type="button" role="checkbox" aria-checked="{{idf.accept}}" onClick="{{toggleAccept}}" style="display: flex; gap: 12px; align-items: flex-start; text-align: left; background: transparent; border: 0; padding: 0; color: #47413A; font-size: 14px; line-height: 1.6"><span style="{{idf.boxStyle}}" aria-hidden="true">{{idf.tick}}</span><span>ยินยอมให้ Khun Mhee เก็บเลขบัตรและรูปบัตรเพื่อลงทะเบียนผู้เข้าพักตามกฎหมาย รูปบัตรจะถูกลบอัตโนมัติ {{idf.keepDays}} วันหลังเช็คเอาท์</span></button>
<template data-sc="if" value="{{formErr}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; background: #FFFDF9; border: 1px solid #C88193; border-radius: 11px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #9A4E60">{{formErr}}</p></template>
<div style="display: flex; justify-content: flex-end">
<button type="button" onClick="{{submitId}}" disabled="{{idf.busy}}" style="background: #4F7A52; color: #FFFFFF; border: 0; border-radius: 9999px; padding: 15px 30px; font-size: 18px; font-weight: 600">{{idf.submitLabel}}</button>
</div>
</section>
</template>

<!-- รับรหัสประตูทาง LINE (LineGuest.gs) -->
<template data-sc="if" value="{{lineTop}}" hint-placeholder-val="{{ false }}">
<section class="card" aria-labelledby="h-line" style="background: #F6F3EE; border-radius: 18px; padding: 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 16px; align-items: flex-start">
<span style="width: 52px; height: 52px; flex: 0 0 52px; border-radius: 9999px; background: #06C755; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4C7 4 3 7.1 3 11c0 3.4 3 6.2 7.1 6.9l-.6 2.6 3.7-2.5C18 17.7 21 14.6 21 11c0-3.9-4-7-9-7z"></path></svg></span>
<div style="flex: 1 1 auto; min-width: 0">
<h2 id="h-line" style="margin: 0; font-size: 21px; font-weight: 600">เชื่อมการจองกับ LINE</h2>
<p style="margin: 4px 0 0; font-size: 15px; line-height: 1.6; color: #5E554C">ส่งรหัสการจอง เว้นวรรค ตามด้วยเบอร์โทรที่ใช้จอง ในแชท LINE ของ Khun Mhee เราจะแจ้งเตือนก่อนวันเข้าพักและวันเช็คเอาท์ และส่งรหัสประตูให้ในวันเช็คอิน</p>
</div>
</div>
<div style="background: #FFFDF9; border: 1px solid #E2D8C6; border-radius: 12px; padding: 12px 16px">
<p style="margin: 0; font-size: 13px; color: #5E554C">พิมพ์ในแชทแบบนี้</p>
<p style="margin: 2px 0 0; font-size: 19px; font-weight: 600; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; color: #47413A">{{line.sample}}</p>
</div>
<div style="display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap">
<a class="pill" href="{{line.url}}" style="flex: 0 0 auto; background: #06C755; color: #FFFFFF; border: 0; border-radius: 9999px; padding: 13px 26px; font-size: 17px; font-weight: 600; display: inline-block; text-decoration: none; text-align: center">เปิดแชท LINE</a>
<span style="flex: 1 1 220px; font-size: 13px; line-height: 1.6; color: #5E554C">กดปุ่มแล้ว LINE จะพิมพ์ข้อความนี้ให้ กดส่งได้เลย ถ้ายังไม่ได้เป็นเพื่อนกับ Khun Mhee กด "เพิ่มเพื่อน" ด้วย · เปิดจากคอมพิวเตอร์ ให้ค้นหา {{line.oa}} ในแอป LINE บนมือถือแล้วส่งข้อความนี้</span>
</div>
</section>
</template>

<!-- 4. เข้าพักอยู่: รหัสประตูรับทาง LINE เท่านั้น (ไม่แสดงบนหน้าเว็บ) -->
<template data-sc="if" value="{{inStay}}" hint-placeholder-val="{{ false }}">
<section class="card" aria-labelledby="h-door" style="background: #3A352F; color: #F6F3EE; border-radius: 18px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
<template data-sc="if" value="{{justIn}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 15px; color: #DCC881; font-weight: 600">เช็คอินเรียบร้อย ยินดีต้อนรับค่ะ</p></template>
<span style="width: 64px; height: 64px; border-radius: 9999px; background: #06C755; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M10.8 12.2L20 3M16 7l3 3M14 9l2 2"></path></svg></span>
<h2 id="h-door" tabindex="-1" style="margin: 0; font-size: 26px; font-weight: 600; line-height: 1.3; color: #FFFFFF">รับรหัสประตูทาง LINE</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #D9D1C5; max-width: 460px">{{door.note}}</p>
<template data-sc="if" value="{{door.canLine}}" hint-placeholder-val="{{ true }}"><div style="margin-top: 4px; background: rgba(246,243,238,0.08); border: 1px solid #5E554C; border-radius: 12px; padding: 12px 18px"><p style="margin: 0; font-size: 13px; color: #D9D1C5">พิมพ์ในแชทแบบนี้</p><p style="margin: 2px 0 0; font-size: 20px; font-weight: 600; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; color: #FFFFFF">{{line.sample}}</p></div></template>

<script src="js/morphdom.min.js"></script>
<script src="js/runtime.js"></script>

<script>
/* หน้าเช็คอินด้วยตัวเอง (เช็คเอาท์แยกไปที่ checkout.html)
 * กรอกรหัสการจอง + เบอร์โทร → เช็คอินทันทีและแสดงรหัสประตู
 * ใช้คำสั่ง publicCheckinInfo (SelfCheckin.gs) และ publicQuickCheckin (Extras.gs) */
const KM_CI_SAVE = 'km_checkin';
// true = แสดงฟอร์มกรอกเลขบัตร + ถ่ายรูปบัตรก่อนเช็คอิน (เมื่อระบบหลังบ้านตั้งให้ต้องยืนยันบัตร) · false = เช็คอินด้วยรหัสการจอง + เบอร์โทรอย่างเดียว
const KM_ID_FORM = false;
const kmCiCall = (action, args, write) => (typeof window.kmCall === 'function'
  ? window.kmCall(action, args, write ? { write: true } : undefined)
  : window.kmApi.apply(null, [action].concat(args)));
const kmCiMsg = (e) => {
  const m = String((e && e.message) || e).replace(/^BUSY:\s*/, '');
  return /ไม่รู้จักคำสั่ง/.test(m) ? 'ระบบเช็คอินด้วยตัวเองยังไม่เปิดใช้งาน กรุณาติดต่อที่พัก' : m;
};

class Component extends DCLogic {
constructor(props) {
super(props);
let sv = null, bk = null;
try { sv = JSON.parse(localStorage.getItem(KM_CI_SAVE) || 'null'); } catch (e) {}
try { bk = JSON.parse(localStorage.getItem('km_booking') || 'null'); } catch (e) {}
const q = new URLSearchParams(window.__kmQuery || location.search);
const qCode = (q.get('code') || '').toUpperCase();
const pickSaved = (o) => o && (!qCode || String(o.code).toUpperCase() === qCode) ? o : null;
const base = pickSaved(sv) || pickSaved(bk) || {};
this.state = {
code: qCode || String(base.code || '').toUpperCase(), phone: q.get('phone') || base.phone || '',
busy: false, findErr: '', info: null, justIn: false, copied: false,
formErr: '',
done: null,
idf: { foreign: false, nationality: '', idNumber: '', photo: null, accept: false }, idTried: false, photoBusy: false,
bkCopied: false
};
}
componentDidMount() {
if (this.state.code && this.state.phone) this.find(true);
else { const i = document.getElementById('ci-code'); if (i) i.focus({ preventScroll: true }); }
}
focus(id) { setTimeout(() => { const el = document.getElementById(id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.focus({ preventScroll: true }); } }, 0); }
remember(on) {
try {
if (on) localStorage.setItem(KM_CI_SAVE, JSON.stringify({ code: this.state.code, phone: this.state.phone.trim() }));
else localStorage.removeItem(KM_CI_SAVE);
} catch (e) {}
}
setInfo(info, extra) {
const st = Object.assign({ busy: false, info, findErr: '', formErr: '' }, extra || {});
this.setState(st);
this.remember(['in', 'open', 'early', 'busy'].indexOf(info.step) >= 0);
if (info.step === 'open') this.focus('h-form');
else if (info.step === 'in') this.focus('h-door');
}
find(auto) {
const s = this.state;
if (s.busy) return;
const code = String(s.code || '').trim().toUpperCase(), phone = String(s.phone || '').trim();
if (!code || !phone) return this.setState({ findErr: 'กรุณากรอกทั้งรหัสการจองและเบอร์โทรศัพท์' });
this.setState({ busy: true, findErr: '', code });
kmCiCall('publicCheckinInfo', [code, phone])
.then((info) => {
if (info.step === 'open' && !auto && !(KM_ID_FORM && info.requireId)) return this.quickIn(code, phone);
this.setInfo(info, { justIn: false, done: null });
})
.catch((e) => { if (auto) this.remember(false); this.setState({ busy: false, findErr: kmCiMsg(e) }); });
}
/* เช็คอินทันทีด้วยรหัสการจอง + เบอร์โทร แล้วแสดงรหัสประตู (คำสั่ง publicQuickCheckin ใน Extras.gs) */
quickIn(code, phone) {
this.setState({ busy: true, findErr: '', formErr: '' });
return kmCiCall('publicQuickCheckin', [code, phone], true)
.then((info) => { this.setInfo(info, { justIn: info.step === 'in', done: null }); window.scrollTo(0, 0); })
.catch((e) => {
const msg = kmCiMsg(e);
if (this.state.info) this.setState({ busy: false, formErr: msg });
else this.setState({ busy: false, findErr: msg });
kmCiCall('publicCheckinInfo', [code, phone]).then((info) => this.setState({ info })).catch(() => {});
});
}
setIdf(patch) { this.setState({ idf: Object.assign({}, this.state.idf, patch), formErr: '' }); }
/* ย่อรูปบัตรให้ไม่เกิน 1600px (JPG) ก่อนส่ง · HEIC ที่เบราว์เซอร์เปิดไม่ได้ส่งไฟล์เดิม */
readPhoto(file) {
const MAX = 5 * 1024 * 1024;
const fail = (m) => this.setState({ photoBusy: false, formErr: m, idf: Object.assign({}, this.state.idf, { photo: null }) });
const done = (mimeType, dataUrl) => this.setState({ photoBusy: false, formErr: '',
idf: Object.assign({}, this.state.idf, { photo: { name: file.name, mimeType, base64: dataUrl.replace(/^data:[^,]*,/, '') } }) });
if (!/^image\//.test(file.type)) return fail('กรุณาเลือกไฟล์รูปภาพของบัตร (JPG หรือ PNG)');
this.setState({ photoBusy: true, formErr: '' });
const asIs = () => {
if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)) return fail('รูปบัตรต้องเป็นไฟล์ JPG หรือ PNG');
if (file.size > MAX) return fail('รูปบัตรต้องไม่เกิน 5 MB');
const rd = new FileReader();
rd.onload = () => done(file.type, rd.result);
rd.onerror = () => fail('อ่านไฟล์ไม่สำเร็จ ลองถ่ายรูปใหม่');
rd.readAsDataURL(file);
};
const url = URL.createObjectURL(file);
const img = new Image();
img.onload = () => {
const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
const c = document.createElement('canvas');
c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
URL.revokeObjectURL(url);
done('image/jpeg', c.toDataURL('image/jpeg', 0.85));
};
img.onerror = () => { URL.revokeObjectURL(url); asIs(); };
img.src = url;
}
/* เช็คอินพร้อมยืนยันบัตร (คำสั่ง publicSelfCheckin ใน SelfCheckin.gs) */
submitId() {
const s = this.state, d = s.idf, info = s.info;
if (s.busy || s.photoBusy || !info) return;
const idNo = String(d.idNumber || '').replace(/[\s-]/g, '');
let err = '';
if (d.foreign && String(d.nationality || '').trim().length < 2) err = 'กรุณากรอกสัญชาติ';
else if (!d.foreign && !/^\d{13}$/.test(idNo)) err = 'กรุณากรอกเลขบัตรประชาชน 13 หลัก';
else if (d.foreign && !/^[A-Za-z0-9]{6,20}$/.test(idNo)) err = 'กรุณากรอกเลขพาสปอร์ตให้ถูกต้อง';
else if (!d.photo) err = 'กรุณาถ่ายรูปหรือแนบรูปบัตร';
else if (!d.accept) err = 'กรุณากดยินยอมการเก็บข้อมูลเพื่อลงทะเบียนเข้าพัก';
if (err) return this.setState({ formErr: err, idTried: true });
this.setState({ busy: true, formErr: '' });
kmCiCall('publicSelfCheckin', [info.code, String(s.phone || '').trim(), {
foreign: !!d.foreign, nationality: String(d.nationality || '').trim(), idNumber: idNo, accept: true,
idPhoto: { name: d.photo.name, mimeType: d.photo.mimeType, base64: d.photo.base64 }
}], true)
.then((res) => {
this.setInfo(res, { justIn: res.step === 'in', done: null, idTried: false,
idf: { foreign: false, nationality: '', idNumber: '', photo: null, accept: false } });
window.scrollTo(0, 0);
})
.catch((e) => {
this.setState({ busy: false, formErr: kmCiMsg(e) });
kmCiCall('publicCheckinInfo', [info.code, String(s.phone || '').trim()]).then((i) => { if (i.step !== 'open') this.setState({ info: i }); }).catch(() => {});
});
}
/* คัดลอกข้อความ (มีทางสำรองสำหรับเบราว์เซอร์ในแอป เช่น LINE ที่ไม่มี clipboard API) */
copyText(text, key) {
const ok = () => { this.setState({ [key]: true }); setTimeout(() => this.setState({ [key]: false }), 2000); };
const fallback = () => {
const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
document.body.appendChild(t); t.select(); try { if (document.execCommand('copy')) ok(); } catch (e) {} document.body.removeChild(t);
};
if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}
/* LINE: เปิดแชท OA พร้อมข้อความ "รหัสการจอง เบอร์โทร" ให้ลูกค้ากดส่ง (LineGuest.gs ตอบกลับ) */
lineVals(info, step) {
const s = this.state, chat = window.kmLineChatUrl ? window.kmLineChatUrl(info.line) : '';
const show = !!chat && ['open', 'early', 'busy', 'wait'].indexOf(step) >= 0;
const sample = info.code + ' ' + String(s.phone || '').replace(/[^0-9+]/g, '');
const url = chat ? chat.replace('/R/ti/p/', '/R/oaMessage/') + '/?' + encodeURIComponent(sample) : '';
return {
lineTop: show,
line: { sample, url: url || '#', oa: chat ? decodeURIComponent(chat.split('/R/ti/p/')[1] || '') : '' }
};
}
renderVals() {
const s = this.state, info = s.info;
const range = (a, b) => kmDate.short(a) + ' – ' + kmDate.short(b);
const step = info ? info.step : '';
const out = {
pageTitle: step === 'in' ? 'ห้องของคุณ' : 'เช็คอินด้วยตัวเอง',
checkinHour: String(info ? info.checkinHour : 14), checkoutHour: String(info ? info.checkoutHour : 12),
showLead: !info || step === 'open' || step === 'early',
code: s.code, phone: s.phone, busy: s.busy, findErr: s.findErr,
findLabel: s.busy && !info ? 'กำลังค้นหา…' : 'เช็คอิน',
setCode: (e) => this.setState({ code: e.target.value, findErr: '' }),
setPhone: (e) => this.setState({ phone: e.target.value, findErr: '' }),
find: (e) => { if (e && e.preventDefault) e.preventDefault(); this.find(false); },
showFind: !info, hasInfo: !!info && !s.done,
again: () => { this.remember(false); this.setState({ info: null, done: null, justIn: false, formErr: '' }); setTimeout(() => { const i = document.getElementById('ci-code'); if (i) i.focus(); }, 0); },
blockedMsg: '', canRecheck: false, canCheckin: false, idForm: false, inStay: false, done: s.done,
lineTop: false
};
if (!info || s.done) return out;

const chip = { open: ['พร้อมเช็คอิน', '#E7EFE4', '#2F5A33'], early: ['ยังไม่ถึงเวลาเช็คอิน', '#FBF3DC', '#6B5420'], wait: ['รอยืนยันการชำระเงิน', '#FBF3DC', '#6B5420'], busy: ['ห้องพักยังไม่พร้อม', '#FBF3DC', '#6B5420'],
in: ['เข้าพักอยู่', '#E7EFE4', '#2F5A33'], done: ['เช็คเอาท์แล้ว', '#E6DDCB', '#47413A'], missed: ['เลยวันเข้าพัก', '#F3D6DD', '#7E3E50'], cancelled: ['ยกเลิกแล้ว', '#F3D6DD', '#7E3E50'] }[step] || ['-', '#EDE6D7', '#47413A'];
out.bk = { code: info.code, room: info.roomName, dates: range(info.checkIn, info.checkOut) + ' (' + info.nights + ' คืน)',
chip: chip[0], chipStyle: 'flex: 0 0 auto; border-radius: 9999px; padding: 6px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; background: ' + chip[1] + '; color: ' + chip[2] + ';' };
Object.assign(out, this.lineVals(info, step), { copyBk: () => this.copyText(info.code, 'bkCopied'), copyBkLabel: s.bkCopied ? 'คัดลอกแล้ว' : 'คัดลอก' });

if (step === 'done') {
out.done = { title: 'เช็คเอาท์เรียบร้อยแล้ว', note: 'การจองนี้เช็คเอาท์แล้ว ขอบคุณที่มาพักกับ Khun Mhee นะคะ' };
out.hasInfo = false;
return out;
}
if (['early', 'busy', 'wait', 'missed', 'cancelled'].indexOf(step) >= 0) {
out.blockedMsg = info.reason;
out.canRecheck = step === 'early' || step === 'busy' || step === 'wait';
out.recheckLabel = s.busy ? 'กำลังตรวจสอบ…' : 'ตรวจสอบอีกครั้ง';
out.recheck = () => this.find(false);
return out;
}
if (step === 'open' && KM_ID_FORM && info.requireId) {
const d = s.idf;
const opt = (on) => 'display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 14px 16px; border-radius: 12px; background: #FFFDF9; cursor: pointer; border: ' + (on ? '2px solid #4F7A52' : '1px solid #CFC3AC') + '; margin: ' + (on ? '0' : '1px') + ';';
const missingPhoto = s.idTried && !d.photo;
Object.assign(out, {
idForm: true, firstName: info.firstName ? ' คุณ' + info.firstName : '', formErr: s.formErr,
idf: {
thai: d.foreign ? 'false' : 'true', foreign: !!d.foreign, thaiStyle: opt(!d.foreign), foreignStyle: opt(!!d.foreign),
nationality: d.nationality, idNumber: d.idNumber,
noLabel: d.foreign ? 'เลขพาสปอร์ต · Passport No.' : 'เลขบัตรประชาชน', noHint: d.foreign ? 'เช่น TR1234567' : 'ตัวเลข 13 หลัก',
inputMode: d.foreign ? 'text' : 'numeric',
photoLabel: s.photoBusy ? 'กำลังเตรียมรูป…' : d.photo ? 'แนบรูปบัตรแล้ว' : 'แตะเพื่อถ่ายรูปบัตร',
photoSub: d.photo ? 'แตะเพื่อถ่ายใหม่' : 'ถ่ายด้านหน้าบัตรให้เห็นชื่อและเลขบัตรชัดเจน',
photoBox: 'position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px; border-radius: 18px; cursor: pointer; text-align: center; border: 2px dashed ' + (d.photo ? '#4F7A52' : missingPhoto ? '#9A4E60' : '#CFC3AC') + '; background: ' + (d.photo ? '#E7EFE4' : '#EDE6D7') + ';',
accept: d.accept ? 'true' : 'false', tick: d.accept ? '✓' : '',
boxStyle: 'flex: 0 0 24px; width: 24px; height: 24px; margin-top: 1px; border-radius: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #FFFFFF; background: ' + (d.accept ? '#4F7A52' : '#FFFDF9') + '; border: ' + (d.accept ? '0' : '1px solid ' + (s.idTried ? '#9A4E60' : '#7A6E63')) + ';',
keepDays: String(info.keepIdDays || 90),
busy: s.busy || s.photoBusy, submitLabel: s.busy ? 'กำลังเช็คอิน…' : 'เช็คอิน'
},
pickThai: () => this.setIdf({ foreign: false }),
pickForeign: () => this.setIdf({ foreign: true }),
setNationality: (e) => this.setIdf({ nationality: e.target.value }),
setIdNo: (e) => this.setIdf({ idNumber: e.target.value }),
setPhoto: (e) => { const fl = e.target.files && e.target.files[0]; if (fl) this.readPhoto(fl); e.target.value = ''; },
toggleAccept: () => this.setIdf({ accept: !this.state.idf.accept }),
submitId: () => this.submitId()
});
return out;
}
if (step === 'open') {
Object.assign(out, {
canCheckin: true, firstName: info.firstName ? ' คุณ' + info.firstName : '',
formErr: s.formErr,
submit: () => { if (!s.busy) this.quickIn(info.code, String(s.phone || '').trim()); },
submitLabel: s.busy ? 'กำลังเช็คอิน…' : 'เช็คอิน'
});
return out;
}
// step === 'in'
const stay = info.stay || {};
const code = String(stay.doorCode || '');
Object.assign(out, {
inStay: true, justIn: s.justIn, contact: 'ติดต่อ' + info.contact,
stay: { room: info.roomName, doorCode: code || 'ติดต่อที่พัก', codeSpaced: code.split('').join(' '),
wifiName: stay.wifiName || '', wifiPassword: stay.wifiPassword || '-',
checkout: kmDate.short(info.checkOut) + ' ก่อน ' + (stay.checkoutTime || '12:00') + ' น.',
rules: (stay.rules || []).map((t) => ({ t })) },
copyLabel: s.copied ? 'คัดลอกแล้ว' : 'คัดลอกรหัส',
copyCode: () => {
const ok = () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 2000); };
if (navigator.clipboard && code) navigator.clipboard.writeText(code).then(ok, () => {});
},
door: {
canLine: !!(window.kmLineChatUrl && window.kmLineChatUrl(info.line)),
note: !(window.kmLineChatUrl && window.kmLineChatUrl(info.line)) ? 'กรุณาติดต่อ' + info.contact + ' เพื่อรับรหัสประตู'
: 'รหัสประตูส่งให้ทางแชท LINE ของ Khun Mhee เท่านั้น ส่งรหัสการจอง เว้นวรรค ตามด้วยเบอร์โทรที่ใช้จอง ระบบจะส่งรหัสเข้าห้องให้ทันที'
}
});
return out;
}
}
DC.mount(Component, {});
</script>
