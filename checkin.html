<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khun Mhee – เช็คอินด้วยตัวเอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;family=Noto+Sans+Thai:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDE6D7;color:#47413A;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Noto Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#47413A;text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
button:active:not(:disabled),.pill:active{transform:scale(0.95)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.upl:focus-within{outline:2px solid #A1805D;outline-offset:2px}
input,select,textarea{font-family:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:833px){
 .navlinks{display:none !important}
 .fields2{grid-template-columns:repeat(1,minmax(0,1fr)) !important}
 .page-h{font-size:34px !important}
 .lead{font-size:19px !important}
 .door{font-size:44px !important;letter-spacing:6px !important}
 .card{padding:24px 20px !important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="view">
<div style="width: 100%; min-width: 0; background: #EDE6D7; min-height: 100vh">

<header style="background: #3A352F; color: #F6F3EE; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0 20px; box-sizing: border-box">
<nav aria-label="เมนูหลัก" style="width: 100%; max-width: 1024px; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-size: 12px">
<a href="index.html" style="color: #F6F3EE; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#DCC881" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="10" r="2"></circle><circle cx="9.5" cy="5.5" r="2"></circle><circle cx="14.5" cy="5.5" r="2"></circle><circle cx="18.5" cy="10" r="2"></circle><path d="M12 12c-3 0-5.5 3.5-5.5 6 0 1.6 1.3 2.5 2.8 2.5 1.1 0 1.8-.6 2.7-.6s1.6.6 2.7.6c1.5 0 2.8-.9 2.8-2.5 0-2.5-2.5-6-5.5-6z"></path></svg>
Khun Mhee</a>
<div class="navlinks" style="display: flex; gap: 32px">
<a href="index.html" style="color: #EDE6D7">ห้องพัก</a>
<a href="booking.html" style="color: #EDE6D7">จองห้องพัก</a>
<a href="checkin.html" aria-current="page" style="color: #FFFFFF; font-weight: 600">เช็คอิน</a>
<a href="checkout.html" style="color: #EDE6D7">เช็คเอาท์</a>
<a href="index.html#contact" style="color: #EDE6D7">ติดต่อเรา</a>
</div>
<a href="login.html" style="color: #EDE6D7">แอดมิน</a>
</nav>
</header>

<main style="max-width: 760px; margin: 0 auto; padding: 56px 20px 80px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div>
<a href="index.html" style="font-size: 14px; color: #47413A">‹ กลับหน้าแรก</a>
<h1 class="page-h" style="margin: 12px 0 0; font-size: 48px; font-weight: 600; line-height: 1.2; letter-spacing: -0.28px">{{pageTitle}}</h1>
</div>

<template data-sc="if" value="{{showLead}}" hint-placeholder-val="{{ true }}">
<div role="note" style="display: flex; gap: 18px; align-items: flex-start; background: #E7EFE4; border: 2px solid #4F7A52; border-radius: 18px; padding: 24px 26px; box-sizing: border-box">
<span style="width: 52px; height: 52px; flex: 0 0 52px; border-radius: 9999px; background: #4F7A52; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M10.8 12.2L20 3M16 7l3 3M14 9l2 2"></path></svg></span>
<p class="lead" style="margin: 0; font-size: 23px; font-weight: 600; line-height: 1.55; color: #2F5A33">กรอกรหัสการจองและเบอร์โทร แล้วรับรหัสประตูได้ทันที ตั้งแต่ {{checkinHour}}:00 น. ของวันเข้าพัก ไม่ต้องรอเจ้าหน้าที่</p>
</div>
</template>

<!-- 1. ค้นหาการจอง -->
<template data-sc="if" value="{{showFind}}" hint-placeholder-val="{{ true }}">
<section class="card" aria-labelledby="h-find" style="background: #F6F3EE; border-radius: 18px; padding: 32px; box-sizing: border-box">
<h2 id="h-find" style="margin: 0; font-size: 24px; font-weight: 600">เช็คอินด้วยรหัสการจอง</h2>
<p style="margin: 6px 0 0; font-size: 14px; color: #5E554C">รหัสการจองอยู่ในหน้ายืนยันการจองและอีเมลยืนยัน เช่น KM261103ABCD กดปุ่มแล้วระบบเช็คอินและแสดงรหัสประตูให้ทันที</p>
<form onSubmit="{{find}}" style="margin-top: 24px">
<div class="fields2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">รหัสการจอง *
<input id="ci-code" type="text" value="{{code}}" onInput="{{setCode}}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="เช่น KM261103ABCD" style="height: 52px; border: 1px solid #CFC3AC; border-radius: 11px; padding: 0 14px; font-size: 18px; font-weight: 400; color: #47413A; background: #FFFDF9; text-transform: uppercase; letter-spacing: 0.5px; box-sizing: border-box">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">เบอร์โทรศัพท์ที่ใช้ตอนจอง *
<input type="tel" value="{{phone}}" onInput="{{setPhone}}" autocomplete="tel" placeholder="08X-XXX-XXXX" style="height: 52px; border: 1px solid #CFC3AC; border-radius: 11px; padding: 0 14px; font-size: 18px; font-weight: 400; color: #47413A; background: #FFFDF9; box-sizing: border-box">
</label>
</div>
<template data-sc="if" value="{{findErr}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 16px 0 0; background: #FFFDF9; border: 1px solid #C88193; border-radius: 11px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #9A4E60">{{findErr}}</p></template>
<div style="display: flex; justify-content: flex-end; margin-top: 24px">
<button type="submit" disabled="{{busy}}" style="background: #4F7A52; color: #FFFFFF; border: 0; border-radius: 9999px; padding: 14px 32px; font-size: 18px; font-weight: 600">{{findLabel}}</button>
</div>
</form>
</section>
</template>

<!-- 2. การจองที่พบ -->
<template data-sc="if" value="{{hasInfo}}" hint-placeholder-val="{{ false }}">
<section aria-labelledby="h-bk" style="background: #F6F3EE; border-radius: 18px; padding: 24px 28px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<div style="flex: 1 1 280px; min-width: 0">
<p style="margin: 0; font-size: 13px; color: #7A6E63">การจอง {{bk.code}}</p>
<h2 id="h-bk" style="margin: 2px 0 0; font-size: 22px; font-weight: 600">{{bk.room}}</h2>
<p style="margin: 4px 0 0; font-size: 16px">{{bk.dates}}</p>
</div>
<span style="{{bk.chipStyle}}">{{bk.chip}}</span>
<button type="button" onClick="{{again}}" style="background: transparent; color: #47413A; border: 1px solid #CFC3AC; border-radius: 9999px; padding: 9px 18px; font-size: 14px">ค้นหาการจองอื่น</button>
</section>
</template>

<!-- ยังเช็คอินไม่ได้ / จบแล้ว -->
<template data-sc="if" value="{{blockedMsg}}" hint-placeholder-val="{{ false }}">
<section class="card" style="background: #F6F3EE; border-radius: 18px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<p role="status" style="margin: 0; font-size: 17px; line-height: 1.6; color: #47413A">{{blockedMsg}}</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap">
<template data-sc="if" value="{{canRecheck}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{recheck}}" disabled="{{busy}}" style="background: #4F7A52; color: #FFFFFF; border: 0; border-radius: 9999px; padding: 11px 22px; font-size: 16px; font-weight: 600">{{recheckLabel}}</button></template>
<a class="pill" href="index.html#contact" style="background: transparent; color: #47413A; border: 1px solid #47413A; border-radius: 9999px; padding: 10px 22px; font-size: 16px">ติดต่อที่พัก</a>
</div>
</section>
</template>

<!-- 3. พร้อมเช็คอิน (เปิดหน้าจากข้อมูลที่จำไว้ ยังไม่ได้กดเช็คอิน) -->
<template data-sc="if" value="{{canCheckin}}" hint-placeholder-val="{{ false }}">
<section class="card" aria-labelledby="h-form" style="background: #F6F3EE; border-radius: 18px; padding: 28px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<div style="flex: 1 1 260px; min-width: 0">
<h2 id="h-form" tabindex="-1" style="margin: 0; font-size: 22px; font-weight: 600">พร้อมเช็คอินแล้ว{{firstName}}</h2>
<p style="margin: 6px 0 0; font-size: 15px; line-height: 1.6; color: #5E554C">กดปุ่มเพื่อเช็คอินและรับรหัสประตูห้องได้ทันที</p>
</div>
<button type="button" onClick="{{submit}}" disabled="{{busy}}" style="flex: 0 0 auto; background: #4F7A52; color: #FFFFFF; border: 0; border-radius: 9999px; padding: 15px 30px; font-size: 18px; font-weight: 600">{{submitLabel}}</button>
<template data-sc="if" value="{{formErr}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; flex: 1 1 100%; background: #FFFDF9; border: 1px solid #C88193; border-radius: 11px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #9A4E60">{{formErr}}</p></template>
</section>
</template>

<!-- 4. เข้าพักอยู่: รหัสประตู + ลิงก์ไปหน้าเช็คเอาท์ -->
<template data-sc="if" value="{{inStay}}" hint-placeholder-val="{{ false }}">
<section class="card" aria-labelledby="h-door" style="background: #3A352F; color: #F6F3EE; border-radius: 18px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px">
<template data-sc="if" value="{{justIn}}" hint-placeholder-val="{{ false }}"><p style="margin: 0 0 4px; font-size: 15px; color: #DCC881; font-weight: 600">เช็คอินเรียบร้อย ยินดีต้อนรับค่ะ</p></template>
<h2 id="h-door" tabindex="-1" style="margin: 0; font-size: 18px; font-weight: 400; color: #EDE6D7">รหัสประตู {{stay.room}}</h2>
<p class="door" aria-label="รหัสประตู {{stay.codeSpaced}}" style="margin: 4px 0 0; font-size: 60px; font-weight: 700; letter-spacing: 10px; font-variant-numeric: tabular-nums; color: #FFFFFF">{{stay.doorCode}}</p>
<button type="button" onClick="{{copyCode}}" style="margin-top: 8px; background: transparent; color: #F6F3EE; border: 1px solid #A39A8F; border-radius: 9999px; padding: 9px 20px; font-size: 14px; min-height: 44px">{{copyLabel}}</button>
<p style="margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: #D9D1C5; max-width: 440px">กรุณาอย่าส่งต่อรหัสนี้ให้ผู้อื่น เปิดหน้านี้ดูรหัสได้ตลอดการเข้าพักด้วยรหัสการจองและเบอร์โทร</p>
</section>

<section class="card" aria-labelledby="h-stay" style="background: #F6F3EE; border-radius: 18px; padding: 28px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<h2 id="h-stay" style="margin: 0; font-size: 22px; font-weight: 600">ข้อมูลระหว่างเข้าพัก</h2>
<div class="fields2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<template data-sc="if" value="{{stay.wifiName}}" hint-placeholder-val="{{ true }}">
<div style="background: #FFFDF9; border: 1px solid #E2D8C6; border-radius: 12px; padding: 14px 16px">
<p style="margin: 0; font-size: 13px; color: #5E554C">Wi-Fi</p>
<p style="margin: 2px 0 0; font-size: 16px; font-weight: 600">{{stay.wifiName}}</p>
<p style="margin: 2px 0 0; font-size: 15px">รหัส {{stay.wifiPassword}}</p>
</div>
</template>
<div style="background: #FFFDF9; border: 1px solid #E2D8C6; border-radius: 12px; padding: 14px 16px">
<p style="margin: 0; font-size: 13px; color: #5E554C">เช็คเอาท์</p>
<p style="margin: 2px 0 0; font-size: 16px; font-weight: 600">{{stay.checkout}}</p>
<p style="margin: 2px 0 0; font-size: 14px; color: #5E554C">{{contact}}</p>
</div>
</div>
<div>
<h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 600">ข้อปฏิบัติของบ้าน</h3>
<ul style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.8">
<template data-sc="for" list="{{stay.rules}}" as="r" hint-placeholder-count="4"><li>{{r.t}}</li></template>
</ul>
</div>
</section>

<section class="card" aria-labelledby="h-out" style="background: #F6F3EE; border-radius: 18px; padding: 28px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<div style="flex: 1 1 260px; min-width: 0">
<h2 id="h-out" style="margin: 0; font-size: 22px; font-weight: 600">วันกลับ เช็คเอาท์ด้วยตัวเอง</h2>
<p style="margin: 6px 0 0; font-size: 15px; line-height: 1.6; color: #5E554C">เก็บของให้ครบแล้วเช็คเอาท์ได้ที่หน้าเช็คเอาท์ ถ้าไม่ได้กด ระบบจะเช็คเอาท์ให้อัตโนมัติเวลา {{checkoutHour}}:00 น.</p>
</div>
<a class="pill" href="{{outHref}}" style="flex: 0 0 auto; background: #7D6043; color: #FFFFFF; border-radius: 9999px; padding: 13px 26px; font-size: 17px; font-weight: 600">ไปหน้าเช็คเอาท์ ›</a>
</section>
</template>

<!-- 5. เช็คเอาท์แล้ว -->
<template data-sc="if" value="{{done}}" hint-placeholder-val="{{ false }}">
<section class="card" aria-labelledby="h-done" style="background: #F6F3EE; border-radius: 18px; padding: 40px 32px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
<span style="width: 72px; height: 72px; border-radius: 9999px; background: #4F7A52; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#F6F3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
<h2 id="h-done" tabindex="-1" style="margin: 0; font-size: 30px; font-weight: 600">{{done.title}}</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #5E554C; max-width: 520px">{{done.note}}</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px">
<a class="pill" href="booking.html" style="background: #47413A; color: #F6F3EE; border-radius: 9999px; padding: 11px 22px; font-size: 16px">จองห้องพักอีกครั้ง</a>
<a class="pill" href="index.html" style="background: transparent; color: #47413A; border: 1px solid #47413A; border-radius: 9999px; padding: 10px 22px; font-size: 16px">กลับหน้าแรก</a>
</div>
</section>
</template>

</main>
</div>
</template>
<script src="js/morphdom.min.js"></script>
<script src="js/runtime.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
/* หน้าเช็คอินด้วยตัวเอง (เช็คเอาท์แยกไปที่ checkout.html)
 * กรอกรหัสการจอง + เบอร์โทร → เช็คอินทันทีและแสดงรหัสประตู
 * ใช้คำสั่ง publicCheckinInfo (SelfCheckin.gs) และ publicQuickCheckin (Extras.gs) */
const KM_CI_SAVE = 'km_checkin';
const kmCiCall = (action, args, write) => (typeof window.kmCall === 'function'
  ? window.kmCall(action, args, write ? { write: true } : undefined)
  : window.kmApi.apply(null, [action].concat(args)));
const kmCiMsg = (e) => {
  const m = String((e && e.message) || e).replace(/^BUSY:\s*/, '');
  return /ไม่รู้จักคำสั่ง/.test(m) ? 'ระบบเช็คอินด้วยตัวเองยังไม่เปิดใช้งาน กรุณาติดต่อที่พัก' : m;
};

class Component extends DCLogic {
constructor(props) {
super(props);
let sv = null, bk = null;
try { sv = JSON.parse(localStorage.getItem(KM_CI_SAVE) || 'null'); } catch (e) {}
try { bk = JSON.parse(localStorage.getItem('km_booking') || 'null'); } catch (e) {}
const q = new URLSearchParams(window.__kmQuery || location.search);
const qCode = (q.get('code') || '').toUpperCase();
const pickSaved = (o) => o && (!qCode || String(o.code).toUpperCase() === qCode) ? o : null;
const base = pickSaved(sv) || pickSaved(bk) || {};
this.state = {
code: qCode || String(base.code || '').toUpperCase(), phone: q.get('phone') || base.phone || '',
busy: false, findErr: '', info: null, justIn: false, copied: false,
formErr: '',
done: null
};
}
componentDidMount() {
if (this.state.code && this.state.phone) this.find(true);
else { const i = document.getElementById('ci-code'); if (i) i.focus({ preventScroll: true }); }
}
focus(id) { setTimeout(() => { const el = document.getElementById(id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.focus({ preventScroll: true }); } }, 0); }
remember(on) {
try {
if (on) localStorage.setItem(KM_CI_SAVE, JSON.stringify({ code: this.state.code, phone: this.state.phone.trim() }));
else localStorage.removeItem(KM_CI_SAVE);
} catch (e) {}
}
setInfo(info, extra) {
const st = Object.assign({ busy: false, info, findErr: '', formErr: '' }, extra || {});
this.setState(st);
this.remember(info.step === 'in' || info.step === 'open' || info.step === 'early');
if (info.step === 'open') this.focus('h-form');
else if (info.step === 'in') this.focus('h-door');
}
find(auto) {
const s = this.state;
if (s.busy) return;
const code = String(s.code || '').trim().toUpperCase(), phone = String(s.phone || '').trim();
if (!code || !phone) return this.setState({ findErr: 'กรุณากรอกทั้งรหัสการจองและเบอร์โทรศัพท์' });
this.setState({ busy: true, findErr: '', code });
kmCiCall('publicCheckinInfo', [code, phone])
.then((info) => {
if (info.step === 'open' && !auto) return this.quickIn(code, phone);
this.setInfo(info, { justIn: false, done: null });
})
.catch((e) => { if (auto) this.remember(false); this.setState({ busy: false, findErr: kmCiMsg(e) }); });
}
/* เช็คอินทันทีด้วยรหัสการจอง + เบอร์โทร แล้วแสดงรหัสประตู (คำสั่ง publicQuickCheckin ใน Extras.gs) */
quickIn(code, phone) {
this.setState({ busy: true, findErr: '', formErr: '' });
return kmCiCall('publicQuickCheckin', [code, phone], true)
.then((info) => { this.setInfo(info, { justIn: info.step === 'in', done: null }); window.scrollTo(0, 0); })
.catch((e) => {
const msg = kmCiMsg(e);
if (this.state.info) this.setState({ busy: false, formErr: msg });
else this.setState({ busy: false, findErr: msg });
kmCiCall('publicCheckinInfo', [code, phone]).then((info) => this.setState({ info })).catch(() => {});
});
}
renderVals() {
const s = this.state, info = s.info;
const range = (a, b) => kmDate.short(a) + ' – ' + kmDate.short(b);
const step = info ? info.step : '';
const out = {
pageTitle: step === 'in' ? 'ห้องของคุณ' : 'เช็คอินด้วยตัวเอง',
checkinHour: String(info ? info.checkinHour : 14), checkoutHour: String(info ? info.checkoutHour : 12),
showLead: !info || step === 'open' || step === 'early',
code: s.code, phone: s.phone, busy: s.busy, findErr: s.findErr,
findLabel: s.busy && !info ? 'กำลังเช็คอิน…' : 'เช็คอินและรับรหัสประตู',
setCode: (e) => this.setState({ code: e.target.value, findErr: '' }),
setPhone: (e) => this.setState({ phone: e.target.value, findErr: '' }),
find: (e) => { if (e && e.preventDefault) e.preventDefault(); this.find(false); },
showFind: !info, hasInfo: !!info && !s.done,
again: () => { this.remember(false); this.setState({ info: null, done: null, justIn: false, formErr: '' }); setTimeout(() => { const i = document.getElementById('ci-code'); if (i) i.focus(); }, 0); },
blockedMsg: '', canRecheck: false, canCheckin: false, inStay: false, done: s.done
};
if (!info || s.done) return out;

const chip = { open: ['พร้อมเช็คอิน', '#E7EFE4', '#2F5A33'], early: ['ยังไม่ถึงเวลาเช็คอิน', '#FBF3DC', '#6B5420'], wait: ['รอยืนยันการชำระเงิน', '#FBF3DC', '#6B5420'],
in: ['เข้าพักอยู่', '#E7EFE4', '#2F5A33'], done: ['เช็คเอาท์แล้ว', '#E6DDCB', '#47413A'], missed: ['เลยวันเข้าพัก', '#F3D6DD', '#7E3E50'], cancelled: ['ยกเลิกแล้ว', '#F3D6DD', '#7E3E50'] }[step] || ['-', '#EDE6D7', '#47413A'];
out.bk = { code: info.code, room: info.roomName, dates: range(info.checkIn, info.checkOut) + ' (' + info.nights + ' คืน)',
chip: chip[0], chipStyle: 'flex: 0 0 auto; border-radius: 9999px; padding: 6px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; background: ' + chip[1] + '; color: ' + chip[2] + ';' };

if (step === 'done') {
out.done = { title: 'เช็คเอาท์เรียบร้อยแล้ว', note: 'การจองนี้เช็คเอาท์แล้ว ขอบคุณที่มาพักกับ Khun Mhee นะคะ' };
out.hasInfo = false;
return out;
}
if (['early', 'wait', 'missed', 'cancelled'].indexOf(step) >= 0) {
out.blockedMsg = info.reason;
out.canRecheck = step === 'early' || step === 'wait';
out.recheckLabel = s.busy ? 'กำลังตรวจสอบ…' : 'ตรวจสอบอีกครั้ง';
out.recheck = () => this.find(false);
return out;
}
if (step === 'open') {
Object.assign(out, {
canCheckin: true, firstName: info.firstName ? ' คุณ' + info.firstName : '',
formErr: s.formErr,
submit: () => { if (!s.busy) this.quickIn(info.code, String(s.phone || '').trim()); },
submitLabel: s.busy ? 'กำลังเช็คอิน…' : 'เช็คอินและรับรหัสประตู'
});
return out;
}
// step === 'in'
const stay = info.stay || {};
const code = String(stay.doorCode || '');
Object.assign(out, {
inStay: true, justIn: s.justIn, contact: 'ติดต่อ' + info.contact,
stay: { room: info.roomName, doorCode: code || 'ติดต่อที่พัก', codeSpaced: code.split('').join(' '),
wifiName: stay.wifiName || '', wifiPassword: stay.wifiPassword || '-',
checkout: kmDate.short(info.checkOut) + ' ก่อน ' + (stay.checkoutTime || '12:00') + ' น.',
rules: (stay.rules || []).map((t) => ({ t })) },
copyLabel: s.copied ? 'คัดลอกแล้ว' : 'คัดลอกรหัส',
copyCode: () => {
const ok = () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 2000); };
if (navigator.clipboard && code) navigator.clipboard.writeText(code).then(ok, () => {});
},
outHref: 'checkout.html?code=' + encodeURIComponent(info.code)
});
return out;
}
}
DC.mount(Component, {});
</script>
</body>
</html>
